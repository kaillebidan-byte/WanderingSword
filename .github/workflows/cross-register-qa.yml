name: Cross register QA

on:
  push:
    branches:
      - agent/cross-register-qa
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python _tools/test_lint_register.py

      - name: Validate curated register fixes
        run: |
          python _tools/validate_fixes_json.py \
            _phase4_proofread/fixes_cross_register_20260723.json \
            _phase4_proofread/fixes_cross_register_coldhawk_20260723.json

      - name: Preview curated register fixes
        run: |
          python _tools/apply_fixes_json.py _phase4_proofread/fixes_cross_register_20260723.json
          python _tools/apply_fixes_json.py _phase4_proofread/fixes_cross_register_coldhawk_20260723.json

      - name: Scan current localization data
        env:
          WS_TMP: ${{ github.workspace }}/_ws_tmp
          PYTHONIOENCODING: utf-8
        run: python _tools/lint_register.py --out-dir _ws_tmp/register_lint

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: register-lint-report
          path: _ws_tmp/register_lint/
          if-no-files-found: error
