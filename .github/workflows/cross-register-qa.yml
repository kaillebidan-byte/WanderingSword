name: Cross register QA

on:
  pull_request:
    types:
      - labeled
    branches:
      - main
    paths:
      - "_phase4_proofread/fixes_*.json"
      - "_phase4_proofread/CANDIDATE_*.json"
      - "_tools/apply_fixes_json.py"
      - "_tools/validate_fixes_json.py"
      - "_tools/lint_register.py"
      - "_tools/check_candidate_ownership.py"
      - "_tools/test_check_candidate_ownership.py"
      - "_tools/test_apply_fixes_json.py"
      - "_tools/test_lint_register.py"
      - ".github/workflows/cross-register-qa.yml"

permissions:
  contents: read

concurrency:
  group: cross-register-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.repository.visibility == 'public' &&
      (github.event.label.name == 'release-ci' || github.event.label.name == 'ci-heavy-rerun')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests and candidate ownership
        run: |
          python _tools/test_check_candidate_ownership.py
          python _tools/check_candidate_ownership.py --require-current-wave
          python _tools/test_apply_fixes_json.py
          python _tools/test_lint_register.py

      - name: Collect register fix batches
        shell: bash
        run: |
          shopt -s nullglob
          files=(_phase4_proofread/fixes_cross_register*.json)
          if ((${#files[@]} == 0)); then
            echo 'No register fix batches found' >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}" > _ws_register_fix_files.txt
          printf 'Found %s curated fix batches\n' "${#files[@]}"

      - name: Validate curated register fixes
        shell: bash
        run: |
          mkdir -p _ws_tmp/register_lint
          mapfile -t files < _ws_register_fix_files.txt
          set -o pipefail
          python _tools/validate_fixes_json.py --allow-applied "${files[@]}" \
            2>&1 | tee _ws_tmp/register_lint/fixes_validation.txt

      - name: Preview curated register fixes once
        shell: bash
        run: |
          mkdir -p _ws_tmp/register_lint
          mapfile -t files < _ws_register_fix_files.txt
          set -o pipefail
          python _tools/apply_fixes_json.py "${files[@]}" \
            2>&1 | tee _ws_tmp/register_lint/fixes_preview.txt

      - name: Scan current localization data
        env:
          WS_TMP: ${{ github.workspace }}/_ws_tmp
          PYTHONIOENCODING: utf-8
        run: python _tools/lint_register.py --out-dir _ws_tmp/register_lint

      - name: Upload report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: register-lint-report
          path: _ws_tmp/register_lint/
          if-no-files-found: error
