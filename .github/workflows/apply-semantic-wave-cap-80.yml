name: Apply semantic wave cap 80

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

concurrency:
  group: apply-semantic-wave-cap-80-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/semantic-wave-cap-80'
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply migration files
        run: python _tools/migrate_semantic_wave_cap_80.py

      - name: Run private-stage regression
        run: python _tools/test_check_private_translation_stage.py

      - name: Run manifest regression
        run: python _tools/test_check_ci_train_manifest.py

      - name: Validate live private-stage state
        run: python _tools/check_private_translation_stage.py

      - name: Validate live manifest state
        run: python _tools/check_ci_train_manifest_phase2_compat.py

      - name: Validate JSON and patch format
        run: |
          python _tools/check_state_json_integrity.py
          git diff --check

      - name: Commit atomic migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _phase4_proofread/PRIVATE_TRANSLATION_STAGES.json \
                  _phase4_proofread/PRIVATE_TRANSLATION_STAGES.md \
                  _phase4_proofread/CI_TRAIN_PHASE1.md \
                  _phase4_proofread/CI_TRAIN_MANIFEST.json \
                  _phase4_proofread/CURRENT_WORK.json \
                  _tools/check_private_translation_stage.py \
                  _tools/check_ci_train_manifest.py \
                  _tools/test_check_private_translation_stage.py \
                  _tools/test_check_ci_train_manifest.py
          if git diff --cached --quiet; then
            echo 'semantic wave cap migration already applied'
            exit 0
          fi
          git commit -m '制度: 意味単位優先でwave上限を80行へ拡張'
          git push origin HEAD:${{ github.head_ref }}
