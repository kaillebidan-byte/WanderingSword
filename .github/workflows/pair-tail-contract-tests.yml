name: Pair tail contract tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "_phase4_proofread/PAIR_TAIL_FLOW_CONTRACT.json"
      - "_tools/pair_tail_*.py"
      - "_tools/refresh_pair_tail_release_candidate.py"
      - "_tools/ensure_pair_tail_handoff_restart.py"
      - "_tools/test_pair_tail_flow.py"
      - "_tools/test_refresh_pair_tail_release_candidate.py"
      - "_tools/test_ensure_pair_tail_handoff_restart.py"
      - ".github/workflows/translation-tail-*.yml"
      - ".github/workflows/pair-tail-contract-tests.yml"

permissions:
  contents: read

concurrency:
  group: pair-tail-contract-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile tail adapters
        run: |
          python -m py_compile \
            _tools/pair_tail_common.py \
            _tools/pair_tail_initializer.py \
            _tools/pair_tail_quality_context.py \
            _tools/pair_tail_encoding_pipeline.py \
            _tools/pair_tail_release_finalizer.py \
            _tools/pair_tail_post_merge.py \
            _tools/refresh_pair_tail_release_candidate.py \
            _tools/ensure_pair_tail_handoff_restart.py
      - name: Run tail regressions
        run: |
          python _tools/test_pair_tail_flow.py
          python _tools/test_refresh_pair_tail_release_candidate.py
          python _tools/test_ensure_pair_tail_handoff_restart.py
          python _tools/test_translation_factory_controller.py
          python _tools/check_state_json_integrity.py
          git diff --check
