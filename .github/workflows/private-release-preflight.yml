name: Private release preflight

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to inspect; defaults to the selected ref
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: private-release-preflight-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-private-release:
    if: >-
      github.event.repository.visibility == 'private' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect ready private release
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("_phase4_proofread/CI_TRAIN_MANIFEST.json").read_text(encoding="utf-8"))
          state = json.loads(Path("_phase4_proofread/PRIVATE_STAGE_STATE.json").read_text(encoding="utf-8"))
          current = json.loads(Path("_phase4_proofread/CURRENT_WORK.json").read_text(encoding="utf-8"))

          ready = (
              manifest.get("status") in {"ready_for_public_ci", "in_public_ci"}
              and state.get("stage") == "translation_frozen"
              and state.get("transport", {}).get("status") in {"ready_for_public_ci", "in_public_ci"}
              and current.get("operation_mode", {}).get("declared_state") == "translation_frozen"
          )
          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"ready={'true' if ready else 'false'}\n")
          print(f"private release ready: {ready}")
          PY

      - name: Run complete private preflight
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p _ws_tmp/private_release_preflight
          python _tools/check_private_release_preflight.py \
            --repository-visibility private \
            --with-tests \
            2>&1 | tee _ws_tmp/private_release_preflight/preflight.txt

      - name: Explain inactive checkpoint
        if: steps.gate.outputs.ready != 'true'
        run: echo "Private release is not at ready_for_public_ci; heavy preflight was skipped."

      - name: Upload private preflight diagnostics
        if: always() && steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: private-release-preflight-${{ github.run_number }}
          path: _ws_tmp/private_release_preflight/
          if-no-files-found: error
