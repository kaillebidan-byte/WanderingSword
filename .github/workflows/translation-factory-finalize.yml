name: Translation factory finalization

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "_factory_requests/finalize-release-*.json"

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: translation-factory-finalization-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout finalization request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve one finalization request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          paths=sorted(Path('_factory_requests').glob('finalize-release-*.json'))
          if len(paths)!=1:
              raise SystemExit(f'expected one finalization request, found {len(paths)}')
          path=paths[0]; value=json.loads(path.read_text(encoding='utf-8'))
          if value.get('branch')!='${{ github.head_ref }}':
              raise SystemExit('request branch mismatch')
          print(f'request={path.as_posix()}')
          print(f'run_id={value["orchestrator_run_id"]}')
          print(f'artifact_name={value["artifact_name"]}')
          PY

      - name: Download fixed finalization inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          path: /tmp/release-finalization
          github-token: ${{ github.token }}
          run-id: ${{ steps.request.outputs.run_id }}

      - name: Execute fixed release finalizer
        run: |
          python _tools/fixed_release_finalizer.py \
            --request "${{ steps.request.outputs.request }}" \
            --artifact-json /tmp/release-finalization/finalization-inputs.json \
            --branch-name "${{ github.head_ref }}" \
            --write \
            --output /tmp/finalization-result.json
          git rm "${{ steps.request.outputs.request }}"

      - name: Validate phase2-ready release state
        run: |
          python _tools/check_state_json_integrity.py
          python _tools/check_release_evidence.py --verify-git-lineage
          python _tools/check_handoff_consistency_v2.py --require-verified
          python _tools/check_ci_train_manifest_v2.py
          python _tools/check_private_translation_stage.py
          python _tools/check_autonomous_cycle.py
          python _tools/check_next_task_packet.py
          python _tools/check_batch_planning.py
          python _tools/check_translation_quality_gate.py
          python _tools/translation_factory_controller.py --repository-visibility public --output /tmp/next-work-order.json
          python - <<'PY'
          import json
          from pathlib import Path
          order=json.loads(Path('/tmp/next-work-order.json').read_text(encoding='utf-8'))
          if order.get('action')!='verify_phase2_and_merge':
              raise SystemExit(f'unexpected post-finalization action: {order.get("action")!r}')
          PY
          git diff --check

      - name: Run finalizer regressions
        run: |
          python _tools/test_fixed_release_finalizer.py
          python _tools/test_check_next_task_packet_minimal.py
          python _tools/test_check_handoff_consistency_v2.py

      - name: Commit phase2-ready release state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _phase4_proofread _factory_requests
          git diff --cached --check
          git commit -m "状態: release evidenceとphase2 checkpointを確定 [factory-finalize]"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
