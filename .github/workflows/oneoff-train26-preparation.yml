name: One-off Yuwen-Mowen train-26 preparation

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    if: ${{ github.head_ref == 'agent/yuwen-mowen-train-26' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/yuwen-mowen-train-26
          fetch-depth: 0
      - name: Lock cycle execution mode
        run: |
          python _tools/select_cycle_execution_mode.py --repository-visibility public --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _phase4_proofread/CURRENT_WORK.json _phase4_proofread/PRIVATE_STAGE_STATE.json
          git commit -m "状態: train-26を常時public modeで開始 [train26-mode-lock]"
          git push
      - name: Download latest relation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/train26-evidence
          mkdir -p /tmp/train26-evidence
          gh run download 30348500770 --repo "${{ github.repository }}" --name relation-audit-evidence --dir /tmp/train26-evidence
          test -f /tmp/train26-evidence/yuwen_mowen.json
      - name: Build source-backed preparation packets
        env:
          PREP_SCRIPT_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          Path("/tmp/train26_prepare.py").write_bytes(gzip.decompress(base64.b64decode(os.environ["PREP_SCRIPT_B64"])))
          PY
          python /tmp/train26_prepare.py
      - name: Write live owner snapshots
        run: |
          python _tools/check_candidate_ownership.py --write             _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENE5274_1_2026-07-28.json             _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENE5278_1_2026-07-28.json             _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES5291_1_5292_3_2026-07-28.json             _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES5293_6_5293_7_2026-07-28.json
      - name: Validate preparation state
        run: |
          python _tools/check_candidate_ownership.py --require-current-wave
          python _tools/check_private_translation_stage.py
          python _tools/check_autonomous_cycle.py
          python _tools/check_ci_train_manifest.py
      - name: Commit sealed preparation and remove one-off workflow
        run: |
          git rm .github/workflows/oneoff-train26-preparation.yml
          git add _phase4_proofread
          git diff --cached --check
          git commit -m "準備: train-26 wave-01を40行でseal [train26-prepared]"
          git push
      - name: Remove bootstrap workflow from main
        run: |
          git fetch origin main
          rm -rf /tmp/train26-main-clean
          git worktree add /tmp/train26-main-clean origin/main
          cd /tmp/train26-main-clean
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-train26-preparation.yml
          git commit -m "制度: train-26一時workflowを削除 [train26-bootstrap-cleanup]"
          git push origin HEAD:main

# bootstrap via main
