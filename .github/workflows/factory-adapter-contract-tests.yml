name: Factory adapter contract tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "README.md"
      - "_phase4_proofread/INSTITUTION_WORK_QUEUE.json"
      - "_phase4_proofread/FACTORY_FLOW_CONTRACT.json"
      - "_phase4_proofread/FACTORY_REQUEST_CONTRACT.json"
      - "_phase4_proofread/FACTORY_FLOW.md"
      - "_phase4_proofread/SESSION_BOOTSTRAP.md"
      - "_phase4_proofread/PROJECT_SCOPE_LOCK.json"
      - "_tools/resume_work_controller.py"
      - "_tools/translation_factory_controller.py"
      - "_tools/fixed_cycle_initializer.py"
      - "_tools/factory_request_executor.py"
      - "_tools/fixed_encoding_pipeline.py"
      - "_tools/factory_encoding_executor.py"
      - "_tools/fixed_release_finalizer.py"
      - "_tools/check_factory_adapters.py"
      - "_tools/check_next_task_packet_v3.py"
      - "_tools/check_batch_planning.py"
      - "_tools/test_resume_work_controller.py"
      - "_tools/test_fixed_cycle_initializer.py"
      - "_tools/test_fixed_encoding_pipeline.py"
      - "_tools/test_factory_encoding_executor.py"
      - "_tools/test_fixed_release_finalizer.py"
      - "_tools/test_check_next_task_packet_minimal.py"
      - "_tools/test_check_batch_planning.py"
      - "_tools/test_translation_factory_controller.py"
      - "_tools/test_translation_factory_workflow.py"
      - ".github/workflows/translation-factory-plan.yml"
      - ".github/workflows/translation-factory-execute.yml"
      - ".github/workflows/translation-factory-encode.yml"
      - ".github/workflows/translation-factory-finalize.yml"
      - ".github/workflows/factory-adapter-contract-tests.yml"

concurrency:
  group: factory-adapter-contract-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adapters:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate resume dispatcher
        run: |
          python _tools/resume_work_controller.py --repository-visibility public --validate-contract-only
          python _tools/test_resume_work_controller.py
      - name: Validate factory contract
        run: python _tools/translation_factory_controller.py --repository-visibility public --validate-contract-only
      - name: Validate permanent adapter wiring
        run: python _tools/check_factory_adapters.py
      - name: Test cycle initializer
        run: python _tools/test_fixed_cycle_initializer.py
      - name: Test encoding pipeline
        run: python _tools/test_fixed_encoding_pipeline.py
      - name: Test encoding executor
        run: python _tools/test_factory_encoding_executor.py
      - name: Test release finalizer
        run: python _tools/test_fixed_release_finalizer.py
      - name: Test minimal next packet
        run: python _tools/test_check_next_task_packet_minimal.py
      - name: Test semantic batch planning
        run: python _tools/test_check_batch_planning.py
      - name: Test factory controller
        run: python _tools/test_translation_factory_controller.py
      - name: Test factory workflows
        run: python _tools/test_translation_factory_workflow.py
      - name: Validate state JSON and diff
        run: |
          python _tools/check_state_json_integrity.py
          git diff --check
