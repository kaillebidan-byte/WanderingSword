name: Bootstrap train-20 always-public cycle

on:
  push:
    branches:
      - agent/yuwen-mowen-train-20
    paths:
      - "_tools/bootstrap_train20_trigger.txt"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select public cycle mode
        run: python _tools/select_cycle_execution_mode.py --repository-visibility public --write
      - name: Sync merged train and initialize train-20
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p4 = Path('_phase4_proofread')
          merge_sha = '68078547b3e4f645c22bedd166f833535c21877d'
          def load(name): return json.loads((p4/name).read_text(encoding='utf-8'))
          def write(name, obj): (p4/name).write_text(json.dumps(obj, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          current = load('CURRENT_WORK.json')
          current['last_merged_translation_pr'] = 145
          current['translation_base_commit'] = merge_sha
          current['state_base_commit'] = merge_sha
          current['status'] = 'in_progress'
          current['operation_mode'].update({
              'execution_mode': 'always_public_full_pipeline',
              'cycle_start_visibility': 'public',
              'mode_locked_for_cycle': True,
              'visibility_change_required': False,
              'visibility_change_requests_forbidden': True,
              'normal_cycle_completion_target': 'merged',
          })
          current['immediate_next'] = {
              'scene_groups': ['9261_1'],
              'task': 'train-20をalways_public_full_pipelineで開始し、preparationからsquash mergeまで公開のまま進める。',
              'boundary': '段階権限を維持し、visibility変更を要求しない。',
              'packet': '_phase4_proofread/NEXT_TASK_PACKET.json',
          }
          current['ci_train'].update({
              'train_id': 'yuwen-mowen-train-20',
              'branch': 'agent/yuwen-mowen-train-20',
              'status': 'preparing',
              'transport_status': 'not_ready',
              'base_checkpoint_batch': 126,
              'draft_pr': None,
              'applied_result': None,
              'verified_result': None,
              'release_evidence': None,
          })
          current['ci_train']['previous_release'] = {
              'train_id': 'yuwen-mowen-train-19',
              'release_id': 'yuwen-mowen-train-19-r1',
              'pr': 145,
              'merge_sha': merge_sha,
          }
          write('CURRENT_WORK.json', current)

          state = load('PRIVATE_STAGE_STATE.json')
          state['train_id'] = 'yuwen-mowen-train-20'
          state['stage'] = 'private_preparation'
          state['cycle_control'].update({
              'status': 'running',
              'continuation_required': True,
              'stop_reason': None,
              'exact_next_action': 'prepare reserved scene 9261_1 and adjacent branches',
              'last_safe_checkpoint': 'merged',
              'execution_mode': 'always_public_full_pipeline',
              'cycle_start_visibility': 'public',
              'mode_locked_for_cycle': True,
              'normal_completion_target': 'merged',
          })
          state['transport'] = {'status': 'not_ready', 'history': [{'status':'merged','pr':145,'merge_sha':merge_sha}]}
          state['permissions'].update({
              'translation_judgment_allowed': False,
              'fix_writes_allowed': False,
              'encoding_writes_allowed': False,
          })
          state['previous_release'] = {'train_id':'yuwen-mowen-train-19','release_id':'yuwen-mowen-train-19-r1','pr':145,'merge_sha':merge_sha}
          state['wave'] = {'wave_id':'yuwen-mowen-train-20-wave-01','queue_status':'building','packets':[]}
          state.pop('verified_result', None)
          write('PRIVATE_STAGE_STATE.json', state)

          packet = load('NEXT_TASK_PACKET.json')
          packet['task_id'] = 'train20-public-wave-reservation'
          packet['release_candidate'] = {'train_id':'yuwen-mowen-train-20','release_id':None,'pr':None,'status':'preparing','merge_sha':None}
          packet['reservation'].update({'wave_id':'yuwen-mowen-train-20-wave-01','packet_id':'yuwen-mowen-9261-1','preparation_started':True})
          packet['ci_train'].update({'train_id':'yuwen-mowen-train-20','planned_batch':127})
          packet['do_not_do'] = [
              'minimal reservationの段階権限を越えてfixやownerを書かない',
              'always_public modeでvisibility変更を要求しない',
              'ゲームフォルダへ配置しない',
          ]
          packet['release_candidate']['merge_sha'] = None
          write('NEXT_TASK_PACKET.json', packet)

          Path('_tools/bootstrap_train20_trigger.txt').unlink(missing_ok=True)
          Path('.github/workflows/bootstrap-train20-public.yml').unlink(missing_ok=True)
          PY
      - name: Commit bootstrap state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "制度: train-20を常時public modeで開始"
          git push origin "HEAD:${GITHUB_REF_NAME}"
