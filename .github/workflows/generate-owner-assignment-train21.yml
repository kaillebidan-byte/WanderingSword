name: Generate owner assignment train21

on:
  push:
    branches:
      - agent/yuwen-mowen-train-21
    paths:
      - .github/workflows/generate-owner-assignment-train21.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate sealed owner assignment
        run: |
          python _tools/apply_owner_assignment_v2.py
          python _tools/check_owner_assignment_result.py
          python _tools/check_private_translation_stage.py
          python _tools/check_ci_train_manifest_v2.py --require-ready
      - name: Commit generated evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _phase4_proofread/OWNER_ASSIGNMENT_RESULT.json
          git add _phase4_proofread/OWNER_ASSIGNMENT_OWNER_DIGESTS_*.json
          git add _phase4_proofread/fixes_*.json
          git add _phase4_proofread/CI_TRAIN_MANIFEST.json
          git add _phase4_proofread/PRIVATE_STAGE_STATE.json
          git add _phase4_proofread/CURRENT_WORK.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m '翻訳: train-21 owner配分と証跡を生成'
          git push origin HEAD:${{ github.ref_name }}
