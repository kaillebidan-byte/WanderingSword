name: Train18 state finalization

on:
  push:
    branches:
      - agent/yuwen-mowen-train-18
    paths:
      - .github/workflows/train18-finalize.yml

permissions:
  contents: write
  pull-requests: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: agent/yuwen-mowen-train-18
          fetch-depth: 0
          lfs: false
      - name: Finalize release state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          P4 = Path('_phase4_proofread')
          PR = 143
          RUN = 30291227741
          CI_HEAD = '53bf6c9f9d1cbb4ec0c8576d42b8c222af580539'
          ASSET_HEAD = '4dfef2b60fdc74ce9758baf6c08761d24e2e1311'
          RELEASE_ID = 'yuwen-mowen-train-18-r1'
          EVIDENCE = '_phase4_proofread/RELEASE_EVIDENCE_YUWEN_MOWEN_TRAIN_18.json'
          APPLIED = '_phase4_proofread/APPLIED_FIXES_YUWEN_MOWEN_BATCH121_2026-07-28.md'
          PAIR = 1274
          PROJECT = 1650
          BATCH = 121

          def load(name):
              return json.loads((P4 / name).read_text(encoding='utf-8'))

          def write(name, value):
              (P4 / name).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          evidence = {
              'schema_version': 2,
              'status': 'verified',
              'release_id': RELEASE_ID,
              'train_id': 'yuwen-mowen-train-18',
              'pr': PR,
              'ci_head': CI_HEAD,
              'asset_head': ASSET_HEAD,
              'applied_record': APPLIED,
              'counts': {
                  'batch': BATCH,
                  'pair_applied_keys': PAIR,
                  'project_applied_keys': PROJECT,
                  'pending_fixes': 0,
              },
              'orchestrator': {
                  'id': RUN,
                  'workflow': 'Release train orchestrator',
                  'head_sha': CI_HEAD,
                  'event': 'pull_request',
                  'conclusion': 'success',
              },
              'lineage': {'mode': 'branch_ancestor', 'merge_sha': None},
              'notes': [
                  '第118〜121束は53 reviewed keys・53 unique reviewed rows・35修正キーとして確定した',
                  '53行のlive owner実測は既存owner所属0・新規owner53・複数owner0で、既存owner値更新は0件だった',
                  '既存4 owner digest shardを保持し、新規4 ownerを第5 shardへ追加して公開preflightで検証した',
                  f'orchestrator run {RUN}で完全preflight、Relation、Cross、Apply、pak再生成、未適用0件、finalization入力生成を成功させた',
                  f'Apply bot asset HEAD {ASSET_HEAD}で適用記録とaudit statusを第121束へ同期した',
                  '次候補9234_6はminimal reservationのまま保持し、PR #143統合前にはprivate preparationを開始しない',
              ],
          }
          write('RELEASE_EVIDENCE_YUWEN_MOWEN_TRAIN_18.json', evidence)

          manifest = load('CI_TRAIN_MANIFEST.json')
          manifest['status'] = 'verified'
          manifest['transport'].update({'status': 'awaiting_private_merge', 'translation_stage': 'translation_frozen', 'pr': PR, 'merge_sha': None})
          for bundle in manifest['bundles']:
              bundle['apply_status'] = 'verified'
          manifest['applied_result'] = {
              'orchestrator_run': RUN,
              'asset_head': ASSET_HEAD,
              'pair_applied_keys': PAIR,
              'project_applied_keys': PROJECT,
              'pending_fixes': 0,
              'checkpoint_status': 'verified',
          }
          manifest['verified_result'] = {
              'release_id': RELEASE_ID,
              'release_evidence': EVIDENCE,
              'record_index_synced': True,
              'pair_applied_keys': PAIR,
              'project_applied_keys': PROJECT,
              'pending_fixes': 0,
          }
          manifest['private_stage'].update({'stage': 'translation_frozen', 'status': 'verified', 'transport_status': 'awaiting_private_merge'})
          write('CI_TRAIN_MANIFEST.json', manifest)

          work = load('CURRENT_WORK.json')
          work.update({
              'status': 'verified',
              'last_completed_batch': BATCH,
              'last_reviewed_batch': BATCH,
              'pair_applied_keys': PAIR,
              'project_applied_keys': PROJECT,
              'build_status': 'verified_not_deployed',
              'game_verified': 'not_started',
          })
          work['checkpoint'] = {
              'status': 'verified',
              'batch': BATCH,
              'pair_applied_keys': PAIR,
              'project_applied_keys': PROJECT,
              'applied_record': APPLIED,
              'produced_by_pr': PR,
              'release_identity': {
                  'kind': 'pr_release_v2',
                  'release_id': RELEASE_ID,
                  'evidence': EVIDENCE,
                  'pr': PR,
                  'validated_head': ASSET_HEAD,
              },
          }
          work['immediate_next'] = {
              'scene_groups': ['9234_6'],
              'task': 'PR #143のphase2成功と未解決review thread 0件を確認し、private復帰後にsquash統合する。',
              'boundary': 'public中は翻訳判断、fix追加、owner変更、第122束preparationを開始しない。',
              'packet': '_phase4_proofread/NEXT_TASK_PACKET.json',
          }
          train = work['ci_train']
          train.update({
              'status': 'verified',
              'transport_status': 'awaiting_private_merge',
              'applied_result': manifest['applied_result'],
              'verified_result': manifest['verified_result'],
              'release_evidence': EVIDENCE,
          })
          train['private_stage'].update({
              'stage': 'translation_frozen',
              'status': 'verified',
              'transport_status': 'awaiting_private_merge',
              'cycle_status': 'target_reached',
              'cycle_checkpoint': 'awaiting_private_merge',
          })
          write('CURRENT_WORK.json', work)

          state = load('PRIVATE_STAGE_STATE.json')
          state['cycle_control'].update({
              'status': 'target_reached',
              'continuation_required': False,
              'stop_reason': None,
              'exact_next_action': None,
              'last_safe_checkpoint': 'awaiting_private_merge',
          })
          for packet in state['wave']['packets']:
              packet['review_record']['apply_status'] = 'verified'
          history = state['transport']['history']
          for entry in (
              {'status': 'in_public_ci', 'translation_stage': 'translation_frozen', 'pr': PR},
              {'status': 'verified', 'translation_stage': 'translation_frozen', 'pr': PR, 'release_id': RELEASE_ID},
              {'status': 'awaiting_private_merge', 'translation_stage': 'translation_frozen', 'pr': PR, 'release_id': RELEASE_ID},
          ):
              if not any(item.get('status') == entry['status'] for item in history):
                  history.append(entry)
          state['transport'].update({'status': 'awaiting_private_merge', 'pr': PR})
          state['verified_result'] = {
              'release_id': RELEASE_ID,
              'evidence': EVIDENCE,
              'ci_head': CI_HEAD,
              'asset_head': ASSET_HEAD,
              'pending_fixes': 0,
          }
          write('PRIVATE_STAGE_STATE.json', state)

          packet = load('NEXT_TASK_PACKET.json')
          packet.update({
              'schema_version': 6,
              'status': 'ready',
              'task_id': 'post-train18-minimal-wave-reservation',
              'current_pair': '宇文逸↔莫問',
              'scene_groups': ['9234_6'],
          })
          packet['based_on_checkpoint'] = {
              'batch': BATCH,
              'pair_applied_keys': PAIR,
              'project_applied_keys': PROJECT,
              'produced_by_pr': PR,
              'release_id': RELEASE_ID,
              'release_evidence': EVIDENCE,
          }
          packet['reservation'] = {
              'status': 'reserved_only',
              'wave_id': None,
              'packet_id': None,
              'preparation_started': False,
              'quality_audit_started': False,
              'encoding_started': False,
              'formal_batch': None,
          }
          packet['source'] = {
              'artifact_workflow': 'Release train orchestrator',
              'artifact_name': 'relation-audit-evidence',
              'artifact_file': 'yuwen_mowen.json',
              'artifact_run': RUN,
              'artifact_id': 8662856448,
              'artifact_digest': 'sha256:36d2a78465fa1c0f47860552f5d8433d722f349b1a10750d14cef8652052224e',
              'artifact_head': CI_HEAD,
              'freshness_rule': 'train-18統合後、private preparation開始時に最新Relation artifactで9234_6と近接分岐を再確認する。',
          }
          packet['release_candidate'] = {
              'train_id': 'yuwen-mowen-train-18',
              'release_id': RELEASE_ID,
              'pr': PR,
              'status': 'verified',
              'merge_sha': None,
          }
          packet['do_not_do'] = [
              'minimal reservationへfocus key・voice question・FACT_DOUBT・owner snapshot・batch planningを戻さない',
              'train-18統合前に9234_6のprivate preparationを開始しない',
              'public中に翻訳判断、fix追加、owner変更、正式束追加を行わない',
              'ゲームフォルダへ配置しない',
          ]
          packet['ci_train'] = {
              'phase': 'phase1_wave',
              'train_id': 'yuwen-mowen-train-18',
              'manifest': '_phase4_proofread/CI_TRAIN_MANIFEST.json',
              'planned_batch': 122,
              'post_merge_state_pr_required': False,
              'single_pr_finalization': True,
          }
          write('NEXT_TASK_PACKET.json', packet)

          handoff = '''# 現在の申し送り

> 再開指示: `現状把握して作業の続きを`
>
> 実visibility、GitHub PR metadata、Actionsを文書中の固定値より優先する。

## 現在地

- 実visibility: public
- PR #142: squash merged (`2ba6675dfb0d5810ac929840f178ac27651d5338`)
- PR #143: open / ready / mergeable
- train: `yuwen-mowen-train-18`
- verified checkpoint: 第121束 / pair 1274 / project 1650
- last reviewed batch: 第121束
- private stage: `translation_frozen`
- train-18 transport: `awaiting_private_merge`
- queue: 4packet / 53行 / 35修正 / 18保持

## train-18

無名との対峙三分岐と直前の残党処断を監査した。無名の`儂／貴様`、逐語的な慣用句、莫問の怒り、李元興の告発、燕未還・荀杳杳の固有行を修正した。

53行はすべて新規owner。既存owner更新0、複数owner0。orchestrator run `30291227741`で完全preflight、Relation、Cross、Apply、pak再生成、未適用0件、finalization入力生成まで成功した。asset HEADは`4dfef2b60fdc74ce9758baf6c08761d24e2e1311`。

## 次の作業

最新HEADで`finalize-release`によるphase2 gateと未解決review thread 0件を確認する。完了後はrepositoryをprivateへ戻し、検証済みHEADをsquash統合する。

次候補`9234_6`はminimal reservationのまま保持し、train-18統合前にpreparationを開始しない。

## 禁止

- public中に翻訳判断、fix追加、owner変更、正式束追加を行わない。
- private復帰前にPR #143をmergeしない。
- train-18統合前に`9234_6`のpreparationを始めない。
- ゲームフォルダへ配置しない。
'''
          (P4 / 'CURRENT_HANDOFF.md').write_text(handoff, encoding='utf-8')
          PY
      - name: Validate finalized state
        shell: bash
        run: |
          python _tools/check_ci_train_manifest_v2.py
          python _tools/check_private_translation_stage.py
          python _tools/check_autonomous_visibility_cycle.py
          python _tools/check_next_task_packet.py
          python _tools/check_release_evidence.py --verify-git-lineage
          python _tools/check_handoff_consistency_phase2.py --require-verified
      - name: Commit finalized state and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/train18-finalize.yml
          git add _phase4_proofread/RELEASE_EVIDENCE_YUWEN_MOWEN_TRAIN_18.json \
                  _phase4_proofread/CI_TRAIN_MANIFEST.json \
                  _phase4_proofread/CURRENT_WORK.json \
                  _phase4_proofread/PRIVATE_STAGE_STATE.json \
                  _phase4_proofread/NEXT_TASK_PACKET.json \
                  _phase4_proofread/CURRENT_HANDOFF.md
          git commit -m '証跡: train-18 release stateを確定'
          git push origin HEAD:agent/yuwen-mowen-train-18
