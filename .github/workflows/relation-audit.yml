name: Relation audit extraction

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check handoff consistency
        run: |
          python _tools/check_handoff_consistency.py
          python _tools/check_next_task_packet.py

      - name: Unit tests
        run: |
          python _tools/test_check_handoff_consistency.py
          python _tools/test_apply_fixes_json.py
          python _tools/test_extract_relation_context.py

      - name: Collect relation fix batches
        shell: bash
        run: |
          shopt -s nullglob
          files=(_phase4_proofread/fixes_relation_*.json)
          if ((${#files[@]} == 0)); then
            echo 'No relation fix batches found' >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}" > _ws_relation_fix_files.txt
          printf 'Found %s relation fix batches\n' "${#files[@]}"

      - name: Validate curated relation fixes
        shell: bash
        run: |
          mkdir -p _ws_tmp/relation_audit
          mapfile -t files < _ws_relation_fix_files.txt
          python _tools/validate_fixes_json.py --allow-applied "${files[@]}" \
            2>&1 | tee _ws_tmp/relation_audit/fixes_validation.txt

      - name: Preview curated relation fixes once
        shell: bash
        run: |
          mkdir -p _ws_tmp/relation_audit
          mapfile -t files < _ws_relation_fix_files.txt
          set -o pipefail
          python _tools/apply_fixes_json.py "${files[@]}" \
            2>&1 | tee _ws_tmp/relation_audit/fixes_preview.txt

      - name: Extract current relation evidence
        env:
          WS_TMP: ${{ github.workspace }}/_ws_tmp
          PYTHONIOENCODING: utf-8
        run: python _tools/extract_relation_context.py --out-dir _ws_tmp/relation_audit

      - name: Upload evidence inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relation-audit-evidence
          path: _ws_tmp/relation_audit/
          if-no-files-found: error
