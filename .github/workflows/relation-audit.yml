name: Relation audit extraction

on:
  pull_request:
    types:
      - labeled
    branches:
      - main
    paths:
      - "_phase4_proofread/fixes_*.json"
      - "_phase4_proofread/CANDIDATE_*.json"
      - "_phase4_proofread/QUALITY_CHALLENGE_*.md"
      - "_phase4_proofread/TRANSLATION_QUALITY_GATE.md"
      - "_phase4_proofread/CURRENT_WORK.json"
      - "_phase4_proofread/PRIVATE_STAGE_STATE.json"
      - "_phase4_proofread/CI_TRAIN_MANIFEST.json"
      - "_phase4_proofread/NEXT_TASK_PACKET.json"
      - "_tools/apply_fixes_json.py"
      - "_tools/validate_fixes_json.py"
      - "_tools/extract_relation_context.py"
      - "_tools/report_next_task_ownership.py"
      - "_tools/check_candidate_ownership.py"
      - "_tools/test_check_candidate_ownership.py"
      - "_tools/check_operation_mode.py"
      - "_tools/check_release_transport_state.py"
      - "_tools/check_next_task_packet.py"
      - "_tools/check_batch_planning.py"
      - "_tools/check_translation_quality_gate.py"
      - "_tools/test_check_operation_mode.py"
      - "_tools/test_check_release_transport_state.py"
      - "_tools/test_check_next_task_packet_ownership.py"
      - "_tools/test_check_next_task_packet_minimal.py"
      - "_tools/test_check_batch_planning.py"
      - "_tools/test_check_translation_quality_gate.py"
      - "_tools/test_apply_fixes_json.py"
      - "_tools/test_extract_relation_context.py"
      - ".github/workflows/relation-audit.yml"

permissions:
  contents: read

concurrency:
  group: relation-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  extract:
    if: >-
      github.event.repository.visibility == 'public' &&
      github.event.label.name == 'release-qa'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen QA HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report next-task reservation
        run: |
          mkdir -p _ws_tmp/relation_audit
          python _tools/report_next_task_ownership.py \
            --out _ws_tmp/relation_audit/next_task_ownership.json \
            2>&1 | tee _ws_tmp/relation_audit/next_task_ownership.txt

      - name: Check pre-Apply transport, owners, and quality
        shell: bash
        run: |
          mkdir -p _ws_tmp/relation_audit
          set -o pipefail
          python _tools/check_operation_mode.py \
            --repository-visibility "${{ github.event.repository.visibility }}" \
            2>&1 | tee _ws_tmp/relation_audit/operation_mode.txt
          python _tools/check_release_transport_state.py \
            2>&1 | tee _ws_tmp/relation_audit/release_transport_state.txt
          python _tools/check_candidate_ownership.py --require-current-wave \
            2>&1 | tee _ws_tmp/relation_audit/candidate_ownership.txt
          python _tools/check_next_task_packet.py --allow-pending \
            2>&1 | tee _ws_tmp/relation_audit/next_task_packet_check.txt
          python _tools/check_batch_planning.py \
            2>&1 | tee _ws_tmp/relation_audit/batch_planning_check.txt
          python _tools/check_translation_quality_gate.py \
            2>&1 | tee _ws_tmp/relation_audit/translation_quality_gate.txt

      - name: Unit tests
        run: |
          python _tools/test_check_candidate_ownership.py
          python _tools/test_check_next_task_packet_minimal.py
          python _tools/test_check_release_transport_state.py
          python _tools/test_check_operation_mode.py
          python _tools/test_check_next_task_packet_ownership.py
          python _tools/test_check_batch_planning.py
          python _tools/test_check_translation_quality_gate.py
          python _tools/test_apply_fixes_json.py
          python _tools/test_extract_relation_context.py

      - name: Collect relation fix batches
        shell: bash
        run: |
          shopt -s nullglob
          files=(_phase4_proofread/fixes_relation_*.json)
          if ((${#files[@]} == 0)); then
            echo 'No relation fix batches found' >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}" > _ws_relation_fix_files.txt
          printf 'Found %s curated fix batches\n' "${#files[@]}"

      - name: Validate curated relation fixes
        shell: bash
        run: |
          mkdir -p _ws_tmp/relation_audit
          mapfile -t files < _ws_relation_fix_files.txt
          python _tools/validate_fixes_json.py --allow-applied "${files[@]}" \
            2>&1 | tee _ws_tmp/relation_audit/fixes_validation.txt

      - name: Preview curated relation fixes once
        shell: bash
        run: |
          mkdir -p _ws_tmp/relation_audit
          mapfile -t files < _ws_relation_fix_files.txt
          set -o pipefail
          python _tools/apply_fixes_json.py "${files[@]}" \
            2>&1 | tee _ws_tmp/relation_audit/fixes_preview.txt

      - name: Extract current relation evidence
        env:
          WS_TMP: ${{ github.workspace }}/_ws_tmp
          PYTHONIOENCODING: utf-8
        run: python _tools/extract_relation_context.py --out-dir _ws_tmp/relation_audit

      - name: Upload evidence inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relation-audit-evidence
          path: _ws_tmp/relation_audit/
          if-no-files-found: error
