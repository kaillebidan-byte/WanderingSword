name: Apply Yuwen Qingxu batch 4

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      WS_TMP: ${{ github.workspace }}/_ws_tmp
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout branch with LFS assets
        uses: actions/checkout@v4
        with:
          ref: agent/yuwen-qingxu-batch4
          lfs: true
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate batch before application
        run: |
          python _tools/validate_fixes_json.py --allow-applied \
            _phase4_proofread/fixes_relation_yuwen_qingxu_20260723_batch1.json \
            _phase4_proofread/fixes_relation_yuwen_qingxu_20260723_batch2.json \
            _phase4_proofread/fixes_relation_yuwen_qingxu_20260723_batch3.json
          python _tools/validate_fixes_json.py \
            _phase4_proofread/fixes_relation_yuwen_qingxu_20260723_batch4.json

      - name: Apply batch and rebuild pak
        run: >-
          python _tools/apply_fixes_json.py
          _phase4_proofread/fixes_relation_yuwen_qingxu_20260723_batch4.json
          --apply

      - name: Verify batch is fully applied
        run: |
          output="$(python _tools/apply_fixes_json.py _phase4_proofread/fixes_relation_yuwen_qingxu_20260723_batch4.json)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '計0件'
          python _tools/validate_fixes_json.py --allow-applied \
            _phase4_proofread/fixes_relation_yuwen_qingxu_20260723_batch1.json \
            _phase4_proofread/fixes_relation_yuwen_qingxu_20260723_batch2.json \
            _phase4_proofread/fixes_relation_yuwen_qingxu_20260723_batch3.json \
            _phase4_proofread/fixes_relation_yuwen_qingxu_20260723_batch4.json

      - name: Run regression scans
        run: |
          python _tools/test_lint_register.py
          python _tools/test_extract_relation_context.py
          python _tools/lint_register.py --out-dir _ws_tmp/register_lint
          python _tools/extract_relation_context.py --out-dir _ws_tmp/relation_audit

      - name: Verify packaged output
        run: |
          test -s _work/aaWanderingSword_JP_P.pak
          ls -lh _work/aaWanderingSword_JP_P.pak
          git lfs ls-files | grep -F '_work/aaWanderingSword_JP_P.pak'

      - name: Commit localization assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _work/jp/Wandering_Sword/Content/Localization _work/aaWanderingSword_JP_P.pak
          git status --short
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No localization changes to commit'; exit 1; }
          git commit -m "Apply Yuwen Qingxu batch 4"
          git lfs push origin HEAD
          git push origin HEAD:agent/yuwen-qingxu-batch4

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuwen-qingxu-batch4-qa-${{ github.run_number }}
          path: |
            _ws_tmp/register_lint/
            _ws_tmp/relation_audit/
          if-no-files-found: warn
