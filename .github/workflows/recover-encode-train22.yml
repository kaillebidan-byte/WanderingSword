name: Recover encode train22

on:
  push:
    branches:
      - agent/yuwen-mowen-train-22
    paths:
      - .github/workflows/recover-encode-train22.yml

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and run encoding metadata builder
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/encode-train22-wave.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end]) + '\n'
          Path('_ws_tmp').mkdir(exist_ok=True)
          Path('_ws_tmp/train22_build_metadata.py').write_text(script, encoding='utf-8')
          PY
          python _ws_tmp/train22_build_metadata.py > _ws_tmp/train22_build_metadata.log 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat _ws_tmp/train22_build_metadata.log
          exit 0
      - name: Commit metadata builder result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p _phase4_proofread
          cp _ws_tmp/train22_build_metadata.log _phase4_proofread/TRAIN22_ENCODING_BUILD_DIAGNOSTIC.txt
          git add _phase4_proofread
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
          else
            git commit -m '翻訳: train-22収録メタデータを正本化'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Run owner generator and frozen checks
        id: owners
        if: steps.build.outputs.rc == '0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            python _tools/apply_owner_assignment_v2.py
            candidates=(
              _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENE32025_1_2026-07-28.json
              _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES32007_1_32004_1_2026-07-28.json
              _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES32001_2_32001_5_30821_1_2026-07-28.json
              _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES24221_2_24221_3_24221_5_24221_6_2026-07-28.json
              _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES24223_3_24230_1_24232_3_2026-07-28.json
            )
            python _tools/check_candidate_ownership.py --write "${candidates[@]}"
            python _tools/apply_owner_assignment_v2.py
            python _tools/check_owner_assignment_result.py
            python _tools/check_candidate_ownership.py --require-current-wave
            python _tools/check_private_translation_stage.py
            python _tools/check_ci_train_manifest_v2.py --require-ready
            python _tools/check_translation_quality_gate.py
            python _tools/check_next_task_packet.py
            python _tools/check_batch_planning.py
          } > _ws_tmp/train22_owner_generation.log 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat _ws_tmp/train22_owner_generation.log
          exit 0
      - name: Commit owner generator result
        if: steps.build.outputs.rc == '0'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp _ws_tmp/train22_owner_generation.log _phase4_proofread/TRAIN22_OWNER_GENERATION_DIAGNOSTIC.txt
          git add _phase4_proofread
          if git diff --cached --quiet; then
            echo 'No owner changes to commit.'
          else
            git commit -m '翻訳: train-22 owner配分と凍結検査を記録'
            git push origin HEAD:${{ github.ref_name }}
          fi
