name: Train17 prepare private wave

on:
  push:
    branches:
      - agent/yuwen-mowen-train-17
    paths:
      - ".github/workflows/train17-prepare-wave.yml"

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout train branch
        uses: actions/checkout@v4
        with:
          ref: agent/yuwen-mowen-train-17
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest verified relation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ws_tmp/relation
          gh api repos/${{ github.repository }}/actions/artifacts/8647833757/zip > _ws_tmp/relation.zip
          unzip -q _ws_tmp/relation.zip -d _ws_tmp/relation
          test -f _ws_tmp/relation/yuwen_mowen.json

      - name: Generate sealed preparation queue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          data = ''''''
          Path('/tmp/prepare_train17.py').write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
          python /tmp/prepare_train17.py

      - name: Snapshot all current fix owners
        run: |
          python _tools/check_candidate_ownership.py --write \
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES9150_3_9150_4_2026-07-27.json \
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES9154_2_9209_2_9210_1_9223_6_2026-07-27.json \
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES9228_2_9229_2_9230_2_2026-07-27.json

      - name: Validate private preparation state
        run: |
          python _tools/check_candidate_ownership.py --require-current-wave
          python _tools/check_private_translation_stage.py
          python _tools/check_ci_train_manifest_v2.py
          python _tools/check_next_task_packet.py
          python _tools/check_state_json_integrity.py

      - name: Commit prepared wave and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES9150_3_9150_4_2026-07-27.json \
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES9154_2_9209_2_9210_1_9223_6_2026-07-27.json \
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES9228_2_9229_2_9230_2_2026-07-27.json \
            _phase4_proofread/PREPARATION_YUWEN_MOWEN_TRAIN17_WAVE01_2026-07-27.md \
            _phase4_proofread/PRIVATE_STAGE_STATE.json \
            _phase4_proofread/CI_TRAIN_MANIFEST.json \
            _phase4_proofread/CURRENT_WORK.json \
            _phase4_proofread/NEXT_TASK_PACKET.json \
            _phase4_proofread/CURRENT_HANDOFF.md
          git rm .github/workflows/train17-prepare-wave.yml
          git diff --cached --check
          git commit -m "準備: train-17 wave-01を51行で封印"
          git push origin HEAD:agent/yuwen-mowen-train-17
