name: Temporary phase2 body character count

on:
  push:
    branches:
      - temp/phase2-body-char-count-20260801
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  count-source-body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/phase2-body-char-count-20260801
      - name: Count indexed Chinese body text
        shell: bash
        run: |
          python - <<'PY'
          import collections
          import json
          import pathlib
          import re

          index_path = pathlib.Path('_phase4_proofread/by_character.json')
          source_path = pathlib.Path('_phase4_proofread/source_zh.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          source = json.loads(source_path.read_text(encoding='utf-8'))

          rows = [tuple(row) for speaker in index['order'] for row in index['lines'].get(speaker, [])]
          coordinates = ['\x1f'.join(row) for row in rows]
          unique_coordinates = list(dict.fromkeys(coordinates))
          matched = [(coord, source[coord]) for coord in unique_coordinates if coord in source]
          missing = [coord for coord in unique_coordinates if coord not in source]
          extra = [coord for coord in source if coord not in set(unique_coordinates)]

          kana_re = re.compile(r'[\u3040-\u30ff]')
          cjk_re = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          latin_re = re.compile(r'[A-Za-z]')
          tag_re = re.compile(r'<[^>]*>')

          def stats(values):
              raw = ''.join(values)
              no_ws = [re.sub(r'\s+', '', v) for v in values]
              no_tags = [tag_re.sub('', v) for v in values]
              no_tags_no_ws = [re.sub(r'\s+', '', tag_re.sub('', v)) for v in values]
              return {
                  'entries': len(values),
                  'unique_texts': len(set(values)),
                  'empty': sum(v == '' for v in values),
                  'chars_raw': sum(len(v) for v in values),
                  'chars_no_whitespace': sum(len(v) for v in no_ws),
                  'chars_no_angle_tags': sum(len(v) for v in no_tags),
                  'chars_no_angle_tags_no_whitespace': sum(len(v) for v in no_tags_no_ws),
                  'kana': len(kana_re.findall(raw)),
                  'cjk': len(cjk_re.findall(raw)),
                  'latin': len(latin_re.findall(raw)),
                  'min_len': min(map(len, values), default=0),
                  'max_len': max(map(len, values), default=0),
              }

          print('PHASE2_FINAL_COUNT_BEGIN')
          print('index_commit_source=latest-main-base')
          print('index_rows=', len(rows), sep='')
          print('unique_coordinates=', len(unique_coordinates), sep='')
          print('source_entries=', len(source), sep='')
          print('matched_coordinates=', len(matched), sep='')
          print('missing_coordinates=', len(missing), sep='')
          print('extra_source_coordinates=', len(extra), sep='')
          print('INDEXED_CHINESE_STATS=' + json.dumps(stats([text for _, text in matched]), ensure_ascii=False, separators=(',', ':')))
          print('ALL_SOURCE_CHINESE_STATS=' + json.dumps(stats(list(source.values())), ensure_ascii=False, separators=(',', ':')))

          by_part0 = collections.defaultdict(list)
          by_part1 = collections.defaultdict(list)
          for coord, text in matched:
              parts = coord.split('\x1f')
              if len(parts) == 3:
                  by_part0[parts[0]].append(text)
                  by_part1[parts[1]].append(text)
          for name, values in sorted(by_part0.items()):
              print('PART0_STATS=' + json.dumps({'name': name, **stats(values)}, ensure_ascii=False, separators=(',', ':')))
          for name, values in sorted(by_part1.items()):
              print('PART1_STATS=' + json.dumps({'name': name, **stats(values)}, ensure_ascii=False, separators=(',', ':')))

          missing_parts = collections.Counter()
          for coord in missing:
              parts = coord.split('\x1f')
              missing_parts[(parts[0] if len(parts) > 0 else '', parts[1] if len(parts) > 1 else '')] += 1
          print('MISSING_GROUPS=' + json.dumps(missing_parts.most_common(), ensure_ascii=False, separators=(',', ':')))
          print('PHASE2_FINAL_COUNT_END')
          PY
