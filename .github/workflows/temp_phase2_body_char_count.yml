name: Temporary phase2 body character count

on:
  push:
    branches:
      - temp/phase2-body-char-count-20260801
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect-body-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/phase2-body-char-count-20260801
      - name: Inspect index references and candidate source files
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib

          path = pathlib.Path('_phase4_proofread/by_character.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          print('PHASE2_INDEX_BEGIN')
          for section in ('order', 'lines', 'count'):
              value = data.get(section)
              print('section=' + json.dumps([section, type(value).__name__, len(value) if hasattr(value, '__len__') else None], ensure_ascii=False, separators=(',', ':')))
          lines = data.get('lines', {})
          for name, value in list(lines.items())[:8]:
              info = {'name': name, 'type': type(value).__name__, 'length': len(value) if hasattr(value, '__len__') else None}
              if isinstance(value, list):
                  info['item_types'] = [type(x).__name__ for x in value[:8]]
                  safe = []
                  for x in value[:8]:
                      if isinstance(x, (int, float, bool)) or x is None:
                          safe.append(x)
                      elif isinstance(x, dict):
                          safe.append({'dict_keys': list(x.keys())[:20]})
                      elif isinstance(x, list):
                          safe.append({'list_len': len(x), 'item_types': [type(y).__name__ for y in x[:5]]})
                      else:
                          safe.append({'string_len': len(x)} if isinstance(x, str) else {'type': type(x).__name__})
                  info['preview'] = safe
              elif isinstance(value, dict):
                  info['keys'] = list(value.keys())[:20]
              print('line_entry=' + json.dumps(info, ensure_ascii=False, separators=(',', ':')))

          files = []
          for p in pathlib.Path('.').rglob('*'):
              if p.is_file() and '.git' not in p.parts:
                  try:
                      files.append((p.stat().st_size, p.as_posix()))
                  except OSError:
                      pass
          print('largest_files=')
          for size, name in sorted(files, reverse=True)[:80]:
              print(json.dumps([size, name], ensure_ascii=False, separators=(',', ':')))

          print('by_character_references=')
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.stat().st_size > 2_000_000:
                  continue
              if p.suffix.lower() not in {'.py','.md','.json','.yml','.yaml','.txt','.ps1','.sh'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if 'by_character.json' in text:
                  print(p.as_posix())
          print('PHASE2_INDEX_END')
          PY
