name: Temporary phase2 body character count

on:
  push:
    branches:
      - temp/phase2-body-char-count-20260801
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect-body-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/phase2-body-char-count-20260801
      - name: Inspect string fields in phase 2 source
        shell: bash
        run: |
          python - <<'PY'
          import collections
          import json
          import pathlib
          import re

          path = pathlib.Path('_phase4_proofread/by_character.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          kana = re.compile(r'[\u3040-\u30ff]')
          cjk = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          latin = re.compile(r'[A-Za-z]')

          stats = collections.defaultdict(lambda: collections.Counter())
          signatures = collections.Counter()
          root_samples = []
          max_depth = 0
          scalar_paths = collections.Counter()

          def add_stat(key, value):
              s = stats[str(key)]
              s['values'] += 1
              s['chars'] += len(value)
              s['non_ws'] += len(re.sub(r'\s+', '', value))
              s['kana'] += len(kana.findall(value))
              s['cjk'] += len(cjk.findall(value))
              s['latin'] += len(latin.findall(value))

          def walk(obj, trail=()):
              global max_depth
              max_depth = max(max_depth, len(trail))
              if isinstance(obj, dict):
                  signatures[tuple(sorted(map(str, obj.keys())))] += 1
                  for key, value in obj.items():
                      if isinstance(value, str):
                          add_stat(key, value)
                          scalar_paths['/'.join((trail + (str(key),))[-4:])] += 1
                      walk(value, trail + (str(key),))
              elif isinstance(obj, list):
                  for i, value in enumerate(obj):
                      walk(value, trail + (f'[{i}]',))

          walk(data)

          print('PHASE2_STRUCTURE_BEGIN')
          print('source_bytes=', path.stat().st_size, sep='')
          print('root_type=', type(data).__name__, sep='')
          if isinstance(data, dict):
              print('root_key_count=', len(data), sep='')
              print('root_keys=' + json.dumps(list(data.keys())[:30], ensure_ascii=False, separators=(',', ':')))
              for key, value in list(data.items())[:10]:
                  size = len(value) if isinstance(value, (dict, list, str)) else None
                  print('root_item=' + json.dumps([key, type(value).__name__, size], ensure_ascii=False, separators=(',', ':')))
          print('max_depth=', max_depth, sep='')
          print('string_field_count=', len(stats), sep='')
          for key, s in sorted(stats.items(), key=lambda kv: (-kv[1]['chars'], kv[0])):
              print('STRING_FIELD=' + json.dumps({
                  'key': key,
                  'values': s['values'],
                  'chars': s['chars'],
                  'non_ws': s['non_ws'],
                  'kana': s['kana'],
                  'cjk': s['cjk'],
                  'latin': s['latin'],
              }, ensure_ascii=False, separators=(',', ':')))
          print('top_dict_signatures=')
          for sig, count in signatures.most_common(20):
              print(json.dumps({'count': count, 'keys': sig}, ensure_ascii=False, separators=(',', ':')))
          print('top_scalar_paths=')
          for p, count in scalar_paths.most_common(30):
              print(json.dumps([p, count], ensure_ascii=False, separators=(',', ':')))
          print('PHASE2_STRUCTURE_END')
          PY
