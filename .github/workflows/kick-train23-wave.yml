name: Kick train23 wave

on:
  push:
    branches:
      - agent/yuwen-mowen-train-23
    paths:
      - .github/workflows/kick-train23-wave.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract stored builder
        run: |
          mkdir -p _ws_tmp
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/build-train23-wave.yml').read_text(encoding='utf-8')
          start=text.index("cat > _ws_tmp/train23_builder.py.gz.b64 <<'EOF'\n")
          start=text.index('\n',start)+1
          end=text.index('\nEOF\n',start)
          Path('_ws_tmp/train23_builder.py.gz.b64').write_text(text[start:end]+'\n',encoding='ascii')
          PY
          base64 -d _ws_tmp/train23_builder.py.gz.b64 | gzip -d > _ws_tmp/train23_builder.py
          python -m py_compile _ws_tmp/train23_builder.py
      - name: Lock public cycle mode
        run: python _tools/select_cycle_execution_mode.py --repository-visibility public --write
      - name: Write candidates and quality records
        run: python _ws_tmp/train23_builder.py candidates
      - name: Snapshot candidate ownership
        run: |
          candidates=(
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENE24341_2_2026-07-28.json
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES5227_4_5341_2_5341_4_2026-07-28.json
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES6003_4_6003_6_2026-07-28.json
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENE6008_2_2026-07-28.json
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENE6057_12_2026-07-28.json
          )
          python _tools/check_candidate_ownership.py --write "${candidates[@]}"
      - name: Build formal bundles and frozen state
        run: python _ws_tmp/train23_builder.py freeze
      - name: Generate owner assignment and validate
        run: |
          candidates=(
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENE24341_2_2026-07-28.json
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES5227_4_5341_2_5341_4_2026-07-28.json
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENES6003_4_6003_6_2026-07-28.json
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENE6008_2_2026-07-28.json
            _phase4_proofread/CANDIDATE_YUWEN_MOWEN_SCENE6057_12_2026-07-28.json
          )
          python _tools/apply_owner_assignment_v2.py
          python _tools/check_candidate_ownership.py --write "${candidates[@]}"
          python _tools/apply_owner_assignment_v2.py
          python _tools/check_owner_assignment_result.py
          python _tools/check_candidate_ownership.py --require-current-wave
          python _tools/check_private_translation_stage.py
          python _tools/check_ci_train_manifest_v2.py --require-ready
          python _tools/check_translation_quality_gate.py
          python _tools/check_next_task_packet.py
          python _tools/check_batch_planning.py
          python _tools/check_private_release_preflight.py --repository-visibility public --with-tests
      - name: Commit frozen train23 release head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf _ws_tmp _tools/__pycache__
          git checkout -- _tools/__pycache__ 2>/dev/null || true
          git add _phase4_proofread
          git commit -m '翻訳: train-23第141〜145束を収録して凍結'
          git push origin HEAD:${{ github.ref_name }}
