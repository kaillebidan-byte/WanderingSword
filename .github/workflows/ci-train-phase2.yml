name: CI train phase2 gate

on:
  pull_request:
    types:
      - labeled
      - synchronize
    branches:
      - main
    paths:
      - "_phase4_proofread/RELEASE_EVIDENCE_*.json"
      - "_phase4_proofread/APPLIED_FIXES_*.md"
      - "_phase4_proofread/QUALITY_CHALLENGE_*.md"
      - "_phase4_proofread/TRANSLATION_QUALITY_GATE.md"
      - "_phase4_proofread/PRIVATE_TRANSLATION_STAGES.json"
      - "_phase4_proofread/PRIVATE_TRANSLATION_STAGES.md"
      - "_phase4_proofread/AUTONOMOUS_VISIBILITY_CYCLE.md"
      - "_phase4_proofread/PRIVATE_STAGE_STATE.json"
      - "_phase4_proofread/CI_TRAIN_MANIFEST.json"
      - "_phase4_proofread/CI_TRAIN_PHASE1.md"
      - "_phase4_proofread/CI_TRAIN_PHASE2.md"
      - "_phase4_proofread/CURRENT_WORK.json"
      - "_phase4_proofread/CURRENT_HANDOFF.md"
      - "_phase4_proofread/NEXT_TASK_PACKET.json"
      - "_phase4_proofread/VISIBILITY_PREFLIGHT_CONTRACT.json"
      - "_phase4_proofread/SESSION_BOOTSTRAP.md"
      - "_phase4_proofread/PUBLIC_CI_WINDOW.md"
      - "_phase4_proofread/COLD_START_ACCEPTANCE.md"
      - "_phase4_proofread/CANDIDATE_*.json"
      - "_tools/check_candidate_ownership.py"
      - "_tools/test_check_candidate_ownership.py"
      - "_tools/check_fix_owner_delta.py"
      - "_tools/check_private_release_preflight.py"
      - "_tools/check_state_json_integrity.py"
      - "_tools/test_check_state_json_integrity.py"
      - "_tools/check_release_finalization.py"
      - "_tools/check_autonomous_cycle.py"
      - "_tools/test_check_autonomous_cycle.py"
      - "_tools/check_release_transport_state.py"
      - "_tools/test_check_release_transport_state.py"
      - "_tools/write_applied_record.py"
      - "_tools/test_write_applied_record.py"
      - "_tools/test_release_ci_triggers.py"
      - "_tools/check_visibility_preflight_contract.py"
      - "_tools/test_check_visibility_preflight_contract.py"
      - "_tools/check_release_evidence.py"
      - "_tools/check_release_evidence_github.py"
      - "_tools/test_check_release_evidence.py"
      - "_tools/test_check_release_evidence_github.py"
      - "_tools/check_handoff_consistency_v2.py"
      - "_tools/test_check_handoff_consistency_v2.py"
      - "_tools/check_operation_mode.py"
      - "_tools/test_check_operation_mode.py"
      - "_tools/check_private_translation_stage.py"
      - "_tools/test_check_private_translation_stage.py"
      - "_tools/check_ci_train_manifest.py"
      - "_tools/check_ci_train_manifest_v2.py"
      - "_tools/test_check_ci_train_manifest.py"
      - "_tools/check_next_task_packet.py"
      - "_tools/check_next_task_packet_v2.py"
      - "_tools/check_next_task_packet_v3.py"
      - "_tools/test_check_next_task_packet_minimal.py"
      - "_tools/test_check_next_task_packet_ownership.py"
      - "_tools/check_batch_planning.py"
      - "_tools/test_check_batch_planning.py"
      - "_tools/test_check_ci_train_state_v2.py"
      - "_tools/check_translation_quality_gate.py"
      - "_tools/test_check_translation_quality_gate.py"
      - ".github/workflows/release-train-orchestrator.yml"
      - ".github/workflows/relation-audit.yml"
      - ".github/workflows/cross-register-qa.yml"
      - ".github/workflows/apply-curated-fixes.yml"
      - ".github/workflows/ci-train-phase2.yml"

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: ci-train-phase2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  private-reseal:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.repository.visibility == 'private' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'release-ci' &&
      github.event.pull_request.number == 142
    runs-on: ubuntu-latest
    steps:
      - name: Checkout train branch
        uses: actions/checkout@v4
        with:
          ref: agent/yuwen-mowen-train-17
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record PR number and regenerate owner evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p4 = Path('_phase4_proofread')
          pr = 142
          def load(name):
              return json.loads((p4 / name).read_text(encoding='utf-8'))
          def write(name, value):
              (p4 / name).write_text(json.dumps(value, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          manifest = load('CI_TRAIN_MANIFEST.json')
          manifest['draft_pr'] = pr
          manifest['transport']['pr'] = pr
          write('CI_TRAIN_MANIFEST.json', manifest)
          state = load('PRIVATE_STAGE_STATE.json')
          state['transport']['pr'] = pr
          for item in state['transport']['history']:
              if item.get('status') == 'ready_for_public_ci':
                  item['pr'] = pr
          write('PRIVATE_STAGE_STATE.json', state)
          work = load('CURRENT_WORK.json')
          work['ci_train']['draft_pr'] = pr
          write('CURRENT_WORK.json', work)
          handoff = (p4 / 'CURRENT_HANDOFF.md').read_text(encoding='utf-8')
          if '- PR #142: open / draft' not in handoff:
              handoff = handoff.replace(
                  '- PR #141: squash merged (`2d9f4790a8075b27b0c7981607e81c88b579fef1`)',
                  '- PR #141: squash merged (`2d9f4790a8075b27b0c7981607e81c88b579fef1`)\n- PR #142: open / draft',
              )
          handoff = handoff.replace(
              'private release preflightを実行し、成功後にPRをreadyとして公開CI窓を依頼する。',
              'PR #142のprivate release preflightを実行し、成功後にreadyへ切り替えて公開CI窓を依頼する。',
          )
          (p4 / 'CURRENT_HANDOFF.md').write_text(handoff, encoding='utf-8')
          PY
          python _tools/apply_owner_assignment_v2.py

      - name: Verify owner and private release state
        run: |
          python _tools/check_owner_assignment_result.py
          python _tools/check_candidate_ownership.py --release-live
          python _tools/check_private_release_preflight.py --with-tests

      - name: Commit verified state and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/ci-train-phase2.yml
          git rm -f .github/workflows/train17-owner-reseal.yml
          git add \
            .github/workflows/ci-train-phase2.yml \
            _phase4_proofread/OWNER_ASSIGNMENT_RESULT.json \
            _phase4_proofread/CI_TRAIN_MANIFEST.json \
            _phase4_proofread/PRIVATE_STAGE_STATE.json \
            _phase4_proofread/CURRENT_WORK.json \
            _phase4_proofread/CURRENT_HANDOFF.md \
            _phase4_proofread/fixes_*.json
          git diff --cached --check
          git commit -m "証跡: train-17をPR #142で再封印"
          git push origin HEAD:agent/yuwen-mowen-train-17

  validate-release:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.repository.visibility == 'public' &&
      (
        (
          github.event.action == 'labeled' &&
          github.event.label.name == 'finalize-release'
        ) ||
        (
          github.event.action == 'synchronize' &&
          contains(github.event.pull_request.labels.*.name, 'finalize-release')
        )
      )
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout frozen finalization HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare diagnostics
        run: mkdir -p _ws_tmp/ci_train_phase2

      - name: Validate operation and visibility contracts
        shell: bash
        run: |
          set -o pipefail
          python _tools/check_operation_mode.py \
            --repository-visibility "${{ github.event.repository.visibility }}" \
            2>&1 | tee _ws_tmp/ci_train_phase2/operation_mode.txt
          python _tools/check_visibility_preflight_contract.py \
            2>&1 | tee _ws_tmp/ci_train_phase2/visibility_preflight.txt

      - name: Run local phase2-equivalent finalization checks
        shell: bash
        run: |
          set -o pipefail
          python _tools/check_release_finalization.py --with-tests \
            2>&1 | tee _ws_tmp/ci_train_phase2/finalization.txt

      - name: Verify GitHub workflow and PR evidence
        shell: bash
        run: |
          set -o pipefail
          python _tools/check_release_evidence_github.py \
            2>&1 | tee _ws_tmp/ci_train_phase2/release_evidence_github.txt

      - name: Upload phase2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-train-phase2-diagnostics
          path: _ws_tmp/ci_train_phase2/
          if-no-files-found: error
