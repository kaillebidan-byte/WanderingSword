name: Finalize train23 release state

on:
  push:
    branches:
      - agent/yuwen-mowen-train-23
    paths:
      - .github/workflows/finalize-train23-release-state.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write verified release state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p4 = Path('_phase4_proofread')
          work_path = p4 / 'CURRENT_WORK.json'
          state_path = p4 / 'PRIVATE_STAGE_STATE.json'
          manifest_path = p4 / 'CI_TRAIN_MANIFEST.json'
          packet_path = p4 / 'NEXT_TASK_PACKET.json'
          applied_path = p4 / 'APPLIED_FIXES_YUWEN_MOWEN_BATCH145_2026-07-28.md'
          evidence_path = p4 / 'RELEASE_EVIDENCE_YUWEN_MOWEN_TRAIN_23.json'

          work = json.loads(work_path.read_text(encoding='utf-8'))
          state = json.loads(state_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          packet = json.loads(packet_path.read_text(encoding='utf-8'))

          pr = 151
          ci_head = 'bc7731a062918c566195992fb03e7d558cb6b4b8'
          asset_head = '6a166ceadcbe003189186f6ebe9752f8791d096f'
          run_id = 30327015549
          release_id = 'yuwen-mowen-train-23-r1'
          evidence_rel = '_phase4_proofread/RELEASE_EVIDENCE_YUWEN_MOWEN_TRAIN_23.json'
          applied_rel = '_phase4_proofread/APPLIED_FIXES_YUWEN_MOWEN_BATCH145_2026-07-28.md'

          evidence = {
              'schema_version': 2,
              'status': 'verified',
              'release_id': release_id,
              'train_id': 'yuwen-mowen-train-23',
              'pr': pr,
              'ci_head': ci_head,
              'asset_head': asset_head,
              'applied_record': applied_rel,
              'counts': {
                  'batch': 145,
                  'pair_applied_keys': 1332,
                  'project_applied_keys': 1708,
                  'pending_fixes': 0,
              },
              'orchestrator': {
                  'id': run_id,
                  'workflow': 'Release train orchestrator',
                  'head_sha': ci_head,
                  'event': 'pull_request',
                  'conclusion': 'success',
              },
              'lineage': {'mode': 'branch_ancestor', 'merge_sha': None},
              'notes': [
                  '第141〜145束は56 reviewed keys・56 unique reviewed rows・8修正キーとして確定した',
                  'live owner実測は新規owner4・既存owner値更新4・複数owner0だった',
                  '帰隠、借りの返礼、分寸、莫問の変化、束手無策の意味ずれを修正した',
                  '低収穫条件により48保持行を再監査し、追加fix 0件を確認した',
                  'orchestrator run 30327015549で完全preflight、Relation、Cross、Apply、pak再生成、未適用0件、finalization入力生成を成功させた',
                  'Apply bot asset HEAD 6a166ceadcbe003189186f6ebe9752f8791d096fで適用記録とaudit statusを第145束へ同期した',
                  '次候補11996_1はminimal reservationのまま保持し、PR #151統合前にはpreparationを開始しない',
              ],
          }
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          work.update({
              'status': 'verified',
              'last_completed_batch': 145,
              'last_reviewed_batch': 145,
              'pair_applied_keys': 1332,
              'project_applied_keys': 1708,
              'build_status': 'verified_not_deployed',
              'game_verified': 'not_started',
          })
          work['checkpoint'] = {
              'status': 'verified',
              'batch': 145,
              'pair_applied_keys': 1332,
              'project_applied_keys': 1708,
              'produced_by_pr': pr,
              'release_identity': {
                  'kind': 'pr_release_v2',
                  'release_id': release_id,
                  'evidence': evidence_rel,
                  'pr': pr,
                  'validated_head': asset_head,
              },
              'applied_record': applied_rel,
          }
          work['operation_mode']['declared_state'] = 'translation_frozen'
          work['immediate_next'] = {
              'scene_groups': ['11996_1'],
              'task': 'PR #151のfinalize-release phase2と未解決review thread 0件を確認し、検証済みHEADをsquash統合する。',
              'boundary': 'translation freeze後は翻訳判断、fix追加、owner変更、正式束追加を行わない。',
              'packet': '_phase4_proofread/NEXT_TASK_PACKET.json',
          }
          train = work['ci_train']
          train.update({
              'status': 'verified',
              'transport_status': 'awaiting_private_merge',
              'draft_pr': pr,
              'applied_result': {
                  'orchestrator_run': run_id,
                  'asset_head': asset_head,
                  'pair_applied_keys': 1332,
                  'project_applied_keys': 1708,
                  'pending_fixes': 0,
                  'checkpoint_status': 'verified',
              },
              'verified_result': {
                  'release_id': release_id,
                  'release_evidence': evidence_rel,
                  'record_index_synced': True,
                  'pair_applied_keys': 1332,
                  'project_applied_keys': 1708,
                  'pending_fixes': 0,
              },
              'release_evidence': evidence_rel,
          })
          train['private_stage'].update({
              'stage': 'translation_frozen',
              'status': 'verified',
              'transport_status': 'awaiting_private_merge',
              'cycle_status': 'running',
              'cycle_checkpoint': 'awaiting_private_merge',
          })

          state['cycle_control'].update({
              'status': 'running',
              'continuation_required': True,
              'stop_reason': None,
              'exact_next_action': 'PR #151のfinalize-release phase2とreview thread 0件を確認し、検証済みHEADをsquash mergeする',
              'last_safe_checkpoint': 'awaiting_private_merge',
          })
          for item in state['wave']['packets']:
              item['review_record']['apply_status'] = 'verified'
          state['transport'] = {
              'status': 'awaiting_private_merge',
              'history': [
                  {'status': 'not_ready', 'translation_stage': 'private_preparation'},
                  {'status': 'ready_for_public_ci', 'translation_stage': 'translation_frozen', 'pr': pr},
                  {'status': 'in_public_ci', 'translation_stage': 'translation_frozen', 'pr': pr},
                  {'status': 'verified', 'translation_stage': 'translation_frozen', 'pr': pr, 'release_id': release_id},
                  {'status': 'awaiting_private_merge', 'translation_stage': 'translation_frozen', 'pr': pr, 'release_id': release_id},
              ],
              'pr': pr,
              'merge_sha': None,
          }
          state['verified_result'] = {
              'release_id': release_id,
              'evidence': evidence_rel,
              'ci_head': ci_head,
              'asset_head': asset_head,
              'pending_fixes': 0,
          }

          manifest.update({
              'status': 'verified',
              'draft_pr': pr,
              'tracking_mode': 'quality_and_private_stage_verified_in_public_pr',
              'release_evidence': evidence_rel,
          })
          manifest['transport'] = {
              'status': 'awaiting_private_merge',
              'translation_stage': 'translation_frozen',
              'pr': pr,
              'merge_sha': None,
          }
          for bundle in manifest['bundles']:
              bundle['apply_status'] = 'verified'
          manifest['private_stage'].update({
              'stage': 'translation_frozen',
              'status': 'verified',
              'transport_status': 'awaiting_private_merge',
          })
          manifest['applied_result'] = {
              'orchestrator_run': run_id,
              'asset_head': asset_head,
              'pair_applied_keys': 1332,
              'project_applied_keys': 1708,
              'pending_fixes': 0,
              'checkpoint_status': 'verified',
          }
          manifest['verified_result'] = {
              'release_id': release_id,
              'release_evidence': evidence_rel,
              'record_index_synced': True,
              'pair_applied_keys': 1332,
              'project_applied_keys': 1708,
              'pending_fixes': 0,
          }

          packet['based_on_checkpoint'] = {
              'batch': 145,
              'pair_applied_keys': 1332,
              'project_applied_keys': 1708,
              'produced_by_pr': pr,
              'release_id': release_id,
              'release_evidence': evidence_rel,
          }
          packet['source'] = {
              'artifact_workflow': 'Release train orchestrator',
              'artifact_name': 'relation-audit-evidence',
              'artifact_file': 'yuwen_mowen.json',
              'artifact_run': run_id,
              'artifact_id': 8676032201,
              'artifact_digest': 'sha256:b3e714fba8891fe180d6ec02322e6ad5f14ef977d44d84c85bd5f8a336951232',
              'artifact_head': ci_head,
              'freshness_rule': 'train-23統合後、次cycleのpreparation開始時に最新Relation artifactで11996_1と近接場面を再確認する。',
          }
          packet['release_candidate'].update({'pr': pr, 'status': 'verified', 'merge_sha': None})

          applied = applied_path.read_text(encoding='utf-8').replace(
              '- release evidence: `None`',
              f'- release evidence: `{evidence_rel}`',
          )
          applied_path.write_text(applied, encoding='utf-8')

          for path, value in ((work_path, work), (state_path, state), (manifest_path, manifest), (packet_path, packet)):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          (p4 / 'CURRENT_HANDOFF.md').write_text('''# 現在の申し送り\n\n> 再開指示: `現状把握して作業の続きを`\n>\n> 実visibility、GitHub PR metadata、Actionsを文書中の固定値より優先する。\n\n## 現在地\n\n- 実visibility: public\n- PR #151: open / ready / mergeable\n- train: `yuwen-mowen-train-23`\n- verified checkpoint: 第145束 / pair 1332 / project 1708\n- last reviewed batch: 第145束\n- private stage: `translation_frozen`\n- train-23 transport: `awaiting_private_merge`\n- queue: 5packet / 56行 / 8修正 / 48保持\n\n## train-23\n\n天山後の再同行、武当初期、冤罪、内省、再対峙を監査した。`归隐`、`这一趟是我欠你`、`失了分寸`、`为什么会变成这样`、`束手无策`の意味ずれを修正した。\n\n56行のlive owner実測は新規owner 4、既存owner更新4、複数owner0。低収穫条件により48保持行を再監査し、追加fix 0件を確認した。orchestrator run `30327015549`で完全preflight、Relation、Cross、Apply、pak再生成、未適用0件、finalization入力生成まで成功した。asset HEADは`6a166ceadcbe003189186f6ebe9752f8791d096f`。\n\n## 次の作業\n\n最新HEADで`finalize-release`によるphase2 gateと未解決review thread 0件を確認し、検証済みHEADをsquash統合する。always-public cycleなのでvisibility変更は要求しない。\n\n次候補`11996_1`はminimal reservationのまま保持し、train-23統合前にpreparationを開始しない。\n\n## 禁止\n\n- translation freeze後に翻訳判断、fix追加、owner変更、正式束追加を行わない。\n- phase2成功前にPR #151をmergeしない。\n- train-23統合前に`11996_1`のpreparationを始めない。\n- ゲームフォルダへ配置しない。\n''', encoding='utf-8')
          PY
      - name: Validate finalization
        run: python _tools/check_release_finalization.py --with-tests
      - name: Commit verified release state and remove workflow
        run: |
          rm .github/workflows/finalize-train23-release-state.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _phase4_proofread .github/workflows/finalize-train23-release-state.yml
          git commit -m '記録: train-23 release stateを検証済みに更新'
          git push origin HEAD:${{ github.ref_name }}
