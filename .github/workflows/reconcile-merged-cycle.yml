name: Reconcile merged translation cycle

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reconcile-merged-cycle.yml"
      - "_tools/reconcile_merged_cycle.py"
      - "_tools/test_reconcile_merged_cycle.py"
      - "_phase4_proofread/NEXT_TASK_PACKET.json"
      - "_phase4_proofread/CURRENT_HANDOFF.md"
  workflow_dispatch:

concurrency:
  group: reconcile-merged-translation-cycle
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  reconcile:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run reconciler regression
        run: python _tools/test_reconcile_merged_cycle.py

      - name: Reconcile active merged translation PR
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repository "${GITHUB_REPOSITORY}"
            --write
          )
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            args+=(
              --event-pr "${{ github.event.pull_request.number }}"
              --merge-sha "${{ github.event.pull_request.merge_commit_sha }}"
            )
          fi
          python _tools/reconcile_merged_cycle.py "${args[@]}"

      - name: Commit reconciled state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            _phase4_proofread/CURRENT_WORK.json \
            _phase4_proofread/PRIVATE_STAGE_STATE.json \
            _phase4_proofread/CI_TRAIN_MANIFEST.json \
            _phase4_proofread/NEXT_TASK_PACKET.json \
            _phase4_proofread/CURRENT_HANDOFF.md; then
            echo "No merged state reconciliation required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            _phase4_proofread/CURRENT_WORK.json \
            _phase4_proofread/PRIVATE_STAGE_STATE.json \
            _phase4_proofread/CI_TRAIN_MANIFEST.json \
            _phase4_proofread/NEXT_TASK_PACKET.json \
            _phase4_proofread/CURRENT_HANDOFF.md
          git commit -m "制度: merge済み翻訳cycleの状態を確定"
          git pull --rebase origin main
          git push origin HEAD:main
