name: Reconcile merged translation cycle

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reconcile-merged-cycle.yml"
      - "_phase4_proofread/FINAL_RESPONSE_POLICY.json"
      - "_tools/final_response_policy.py"
      - "_tools/sanitize_final_response_read_order.py"
      - "_tools/reconcile_merged_cycle.py"
      - "_tools/test_reconcile_merged_cycle.py"
      - "_tools/test_final_response_policy.py"
  workflow_dispatch:

concurrency:
  group: reconcile-merged-translation-cycle
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  reconcile:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.head.ref, 'agent/yuwen-mowen-train-')
      )
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run reconciler and response-policy regressions
        run: |
          python _tools/test_reconcile_merged_cycle.py
          python _tools/test_final_response_policy.py

      - name: Reconcile active merged translation PR
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repository "${GITHUB_REPOSITORY}"
            --write
          )
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            args+=(
              --event-pr "${{ github.event.pull_request.number }}"
              --merge-sha "${{ github.event.pull_request.merge_commit_sha }}"
            )
          fi
          python _tools/reconcile_merged_cycle.py "${args[@]}"

      - name: Sanitize routine final-response read order
        run: python _tools/sanitize_final_response_read_order.py --write

      - name: Commit reconciled state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            _phase4_proofread/CURRENT_WORK.json \
            _phase4_proofread/PRIVATE_STAGE_STATE.json \
            _phase4_proofread/CI_TRAIN_MANIFEST.json \
            _phase4_proofread/NEXT_TASK_PACKET.json \
            _phase4_proofread/CURRENT_HANDOFF.md; then
            echo "No merged state or final-response read-order reconciliation required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            _phase4_proofread/CURRENT_WORK.json \
            _phase4_proofread/PRIVATE_STAGE_STATE.json \
            _phase4_proofread/CI_TRAIN_MANIFEST.json \
            _phase4_proofread/NEXT_TASK_PACKET.json \
            _phase4_proofread/CURRENT_HANDOFF.md
          git commit -m "制度: merge状態と最終応答読書順を確定"
          git pull --rebase origin main
          git push origin HEAD:main
