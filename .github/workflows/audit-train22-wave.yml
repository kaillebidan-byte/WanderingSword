name: Audit train22 wave

on:
  push:
    branches:
      - agent/yuwen-mowen-train-22
    paths:
      - .github/workflows/audit-train22-wave.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write two-pass quality audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p4 = Path('_phase4_proofread')
          candidate_names = [
              'CANDIDATE_YUWEN_MOWEN_SCENE32025_1_2026-07-28.json',
              'CANDIDATE_YUWEN_MOWEN_SCENES32007_1_32004_1_2026-07-28.json',
              'CANDIDATE_YUWEN_MOWEN_SCENES32001_2_32001_5_30821_1_2026-07-28.json',
              'CANDIDATE_YUWEN_MOWEN_SCENES24221_2_24221_3_24221_5_24221_6_2026-07-28.json',
              'CANDIDATE_YUWEN_MOWEN_SCENES24223_3_24230_1_24232_3_2026-07-28.json',
          ]
          candidates = [json.loads((p4 / name).read_text(encoding='utf-8')) for name in candidate_names]
          rows = {}
          scene_order = []
          for candidate in candidates:
              for scene in candidate['scene_groups']:
                  if scene not in scene_order:
                      scene_order.append(scene)
              for row in candidate['rows']:
                  if row['key'] in rows:
                      raise SystemExit(f'duplicate candidate key: {row["key"]}')
                  rows[row['key']] = row

          fixes = {
              '32007_1_Dlgs_Index1_Text': {
                  'candidate': '1 - 宇文逸 $@$冷大哥と元興大哥の碁の腕前はなかなかのものです。師兄も腕が鳴るのでは？お二人と一局、打ってみてはいかがですか？',
                  'reason': 'persona/fluency: 莫問への呼称が「兄上」に崩れている。師兄へ戻し、技痒と切磋の親しい誘いを自然にする。',
              },
              '32007_1_Dlgs_Index2_Text': {
                  'candidate': '5015 - 莫問 $@$（笑）天下三智の名は伊達ではない。師弟、わたしをおだてて恥をさらさせるのはよしてくれ。',
                  'reason': 'meaning/persona: 哄は悪意ある「からかう」ではなく、対局へおだてて誘う意。莫問の自嘲として整える。',
              },
              '32004_1_Dlgs_Index8_Text': {
                  'candidate': '1 - 宇文逸 $@$せっかくですから、師兄、もう一度私と剣を合わせてください！',
                  'reason': 'fluency/relationship: 「この良い機会に」「稽古をしてください」の直訳調を除き、陪我练练剑を師兄弟の手合わせとして表す。',
              },
              '32001_2_Dlgs_Index1_Text': {
                  'candidate': '5015 - 莫問 $@$真の雲もまた、流れるものだ。',
                  'reason': 'persona/fluency: 「流動するものです」の説明調と敬体を、莫問の短い武学比喩と平常の常体へ戻す。',
              },
              '32001_5_Dlgs_Index1_Text': {
                  'candidate': '1 - 宇文逸 $@$ですが、武学の高低がどうあれ、私はやはり師兄の師弟です！',
                  'reason': 'relationship/fluency: 「常にあなたの師弟」の不自然な代名詞と時間表現を、武学を超えた師兄弟関係の肯定へ直す。',
              },
              '30821_1_Dlgs_Index3_Text': {
                  'candidate': '1 - 宇文逸 $@$急いで中へ入って確かめよう！',
                  'reason': 'fluency: 「中に入って見てみよう」の重複を除き、快入内一观の即時行動を保つ。',
              },
              '24221_2_Dlgs_Index1_Text': {
                  'candidate': '1 - 宇文逸 $@$師兄、戦いに来たんじゃありません。これを返しに来たんです……',
                  'reason': 'persona/consistency: 不自然な「あなた」を除き、同文の6151_2で確立済みの宇文逸の口調へ同期する。',
              },
              '24221_3_Dlgs_Index1_Text': {
                  'candidate': '1 - 宇文逸 $@$ええ。本当は、もっと早くお返しすべきでした。',
                  'reason': 'fluency/consistency: 物归原主を冗長な「本来の持ち主へ返す」から、6151_3の確立済み表現へ同期する。',
              },
              '24221_3_Dlgs_Index2_Text': {
                  'candidate': '45311 - 莫問 $@$……その必要はない。わたしは、そんなことにはこだわらない。',
                  'reason': 'meaning/persona: 不必を「不要だ」、不在乎を「興味はない」とする誤差を直し、6151_3の莫問の価値観へ同期する。',
              },
              '24221_5_Dlgs_Index1_Text': {
                  'candidate': '1 - 宇文逸 $@$師兄、戦いに来たんじゃありません。師兄に詫びに来たんです。',
                  'reason': 'persona/fluency: 「あなたに詫びる」を避け、返還分岐と同じ宇文逸の師兄への口調を保つ。',
              },
              '24221_6_Dlgs_Index2_Text': {
                  'candidate': '45311 - 莫問 $@$（遮って）その必要はない。',
                  'reason': 'meaning/consistency: 不必は拒絶命令の「不要だ」ではなく、説明は不要という意味。6151_3と同期する。',
              },
              '24221_6_Dlgs_Index3_Text': {
                  'candidate': '45311 - 莫問 $@$わたしは江師叔に一命を救われた恩がある。彼女の両親の死については、天山も責任を免れない……',
                  'reason': 'meaning: 欠一命は「命を借りている」ではなく、一命を救われた恩義。天山の責任範囲は原文以上に広げない。',
              },
              '24223_3_Dlgs_Index0_Text': {
                  'candidate': '45311 - 莫問 $@$わたしを止めるんじゃなかったのか……ごほっ、ごほっ……',
                  'reason': 'meaning/consistency: 不是说を「つもりはないのか」と誤る肯否を直し、同文の6158_5へ同期する。',
              },
              '24230_1_Dlgs_Index1_Text': {
                  'candidate': '45311 - 莫問 $@$……傘を携えて来たということは、彼の仇を討つつもりなのか？',
                  'reason': 'persona/meaning: 莫問の戦闘時の常体へ戻し、「彼のために」ではなく為他報仇を「彼の仇を討つ」とする。',
              },
              '24230_1_Dlgs_Index2_Text': {
                  'candidate': '1 - 宇文逸 $@$いいえ、止めるために来ました。',
                  'reason': 'persona/fluency: 文脈上明白な目的語を不自然な「あなた」で反復せず、宇文逸の簡潔な否定を保つ。',
              },
              '24232_3_Dlgs_Index0_Text': {
                  'candidate': '45311 - 莫問 $@$わたしを止めるんじゃなかったのか……ごほっ、ごほっ……',
                  'reason': 'persona/consistency: 同一原文の24223_3・6158_5と口調・咳表現を同期する。',
              },
              '24232_3_Dlgs_Index1_Text': {
                  'candidate': '1 - 宇文逸 $@$（首を振る）ですが、師兄の剣にはもう殺意がありません……',
                  'reason': 'persona/relationship: 「あなたの剣」を師兄呼称へ戻し、対決中も崩れない敬意を示す。',
              },
              '24232_3_Dlgs_Index2_Text': {
                  'candidate': '1 - 宇文逸 $@$それに……私は、師兄と生死を分かつつもりなど、一度もありませんでした。',
                  'reason': 'persona/consistency: 不自然な「あなた」を除き、同趣旨の6198_3・6214_4で確立済みの表現へ同期する。',
              },
              '24232_3_Dlgs_Index3_Text': {
                  'candidate': '1 - 宇文逸 $@$私にとって、師兄はずっと、武術を教え、江湖を共に駆け巡り、侠義を何より重んじるよう導いてくれた、あの大師兄です！',
                  'reason': 'persona/consistency: 「あなた」を師兄へ戻し、同一原文の6198_3・6214_4へ同期する。',
              },
              '24232_3_Dlgs_Index5_Text': {
                  'candidate': '1 - 宇文逸 $@$師兄に選べる道がないのは分かっています。でも、それでも構いません。',
                  'reason': 'meaning/consistency: 没关系を曖昧な「大丈夫です」から、6198_3・6214_4の受容表現へ同期する。',
              },
              '24232_3_Dlgs_Index6_Text': {
                  'candidate': '1 - 宇文逸 $@$師兄がこれから何をしようと……',
                  'reason': 'persona/consistency: 「あなた」を師兄へ戻し、何度でも止める宣言へ続く6198_3・6214_4の表現へ同期する。',
              },
              '24232_3_Dlgs_Index7_Text': {
                  'candidate': '1 - 宇文逸 $@$何度でも、必ず止めます。',
                  'reason': 'meaning/consistency: 无论多少次から続く反復意思を明示し、同文の6158_5・6198_3へ同期する。',
              },
          }

          missing = sorted(set(fixes) - set(rows))
          if missing:
              raise SystemExit(f'fix keys outside candidate scope: {missing}')
          if len(rows) != 58 or len(fixes) != 22:
              raise SystemExit(f'unexpected counts rows={len(rows)} fixes={len(fixes)}')

          lines = [
              '# 宇文逸↔莫問 train-22 wave-01 private quality audit',
              '',
              '- stage: `private_quality_audit`',
              '- train: `yuwen-mowen-train-22`',
              '- status: `complete`',
              '- sealed queue: 5 packets / 58 rows',
              '',
              'この記録はsealed queue全体の翻訳判断だけを固定する。fix JSON、owner、正式束、manifest totalsはまだ書かない。',
              '',
              '## fix candidates',
              '',
          ]
          for key, decision in fixes.items():
              row = rows[key]
              lines.extend([
                  f'### `{key}` — {row["speaker"]}',
                  f'- 現訳: `{row["ja"]}`',
                  f'- 候補訳: `{decision["candidate"]}`',
                  f'- 理由 ({decision["reason"]})',
                  '',
              ])

          lines.extend(['## intentional keeps', ''])
          for scene in scene_order:
              lines.extend([f'### `{scene}`', ''])
              scene_prefix = scene + '_Dlgs_'
              for key, row in rows.items():
                  if not key.startswith(scene_prefix) or key in fixes:
                      continue
                  if scene == '32025_1' and row['speaker'] not in {'宇文逸', '莫问'}:
                      note = '別人物ペアの所有行。場面文脈として参照し、本人物ペアでは変更しない。'
                  else:
                      note = '現訳保持。'
                  lines.append(f'- `{key}` — {note}')
              lines.append('')

          lines.extend([
              '## fact and ownership boundaries resolved',
              '',
              '- `32025_1`では莫問は発話せず、宇文逸の明示言及だけを本人物ペアの判断対象にした。',
              '- `24221_2/3/5/6`の返還・謝罪分岐を統合せず、各分岐の長短差を保持した。',
              '- `24223_3`と`24232_3`の同文は、既存の`6158_5`・`6198_3`・`6214_4`を再利用して声と意味を同期した。',
              '- 江師叔への恩義は一命を救われた事実までとし、両親の死の因果を追加しない。',
              '- allusion candidateは0件、fact doubtの未解決は0件。',
              '',
              '## second pass',
              '',
              '- 初巡fix候補を、同一原文または同趣旨の`6151_2`、`6151_3`、`6158_5`、`6198_3`、`6214_4`と突き合わせた。',
              '- 既存の安定訳を流用できる行は新しい言い回しを発明せず同期した。',
              '- 未完文、分岐差、推測、別人物行を補完・統合していない。',
              '- 二巡目で追加されたのは重複原文の不一致と師兄呼称の崩れだけで、対象外人物行は取り込んでいない。',
              '',
              '## result',
              '',
              '- reviewed rows: 58',
              '- fix candidates: 22',
              '- intentional keeps: 36',
              '- unresolved: 0',
              '- quality decision: `quality_passed`',
              '- low-yield detected: `false`',
          ])
          (p4 / 'AUDIT_YUWEN_MOWEN_TRAIN22_WAVE01_2026-07-28.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          decisions = {
              'schema_version': 1,
              'train_id': 'yuwen-mowen-train-22',
              'wave_id': 'yuwen-mowen-train-22-wave-01',
              'reviewed_rows': 58,
              'fix_count': 22,
              'keep_count': 36,
              'fixes': {key: value['candidate'] for key, value in fixes.items()},
          }
          (p4 / 'AUDIT_DECISIONS_YUWEN_MOWEN_TRAIN22_WAVE01_2026-07-28.json').write_text(
              json.dumps(decisions, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8'
          )
          PY
      - name: Enter private encoding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p4 = Path('_phase4_proofread')
          current_path = p4 / 'CURRENT_WORK.json'
          state_path = p4 / 'PRIVATE_STAGE_STATE.json'
          manifest_path = p4 / 'CI_TRAIN_MANIFEST.json'
          next_path = p4 / 'NEXT_TASK_PACKET.json'
          current = json.loads(current_path.read_text(encoding='utf-8'))
          state = json.loads(state_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          next_task = json.loads(next_path.read_text(encoding='utf-8'))

          audit_path = '_phase4_proofread/AUDIT_YUWEN_MOWEN_TRAIN22_WAVE01_2026-07-28.md'
          qg = {
              'schema_version': 1,
              'primary_objective': 'repair_substantive_translation_defects',
              'throughput_metrics_role': 'transport_only',
              'low_yield_threshold_percent': 15,
              'reviewed_keys': 58,
              'unique_reviewed_rows': 58,
              'fix_keys': 22,
              'unique_fix_rows': 22,
              'keep_only_bundles': 1,
              'pre_challenge_unique_fix_rows': 22,
              'low_yield_detected': False,
              'release_decision': 'quality_passed',
              'challenge_pass': None,
          }

          current['operation_mode']['declared_state'] = 'private_encoding'
          current['immediate_next'] = {
              'scene_groups': next_task['scene_groups'],
              'task': 'OWNER_ASSIGNMENT_PLANを作成し、監査済み22件だけをownerへ収録して第136〜140束を生成する。',
              'boundary': 'encodingではAUDIT_DECISIONSに固定済みの値だけを書き、新しい翻訳判断を行わない。',
              'packet': '_phase4_proofread/NEXT_TASK_PACKET.json',
          }
          current['ci_train']['status'] = 'private_encoding'
          current['ci_train']['transport_status'] = 'not_ready'
          current['ci_train']['quality_gate'] = qg
          current['ci_train']['private_stage'].update({
              'stage': 'private_encoding',
              'status': 'active',
              'transport_status': 'not_ready',
              'wave_id': 'yuwen-mowen-train-22-wave-01',
              'cycle_status': 'running',
              'cycle_checkpoint': 'private_encoding',
          })

          state['stage'] = 'private_encoding'
          state['cycle_control'].update({
              'status': 'running',
              'continuation_required': True,
              'stop_reason': None,
              'exact_next_action': 'OWNER_ASSIGNMENT_PLANを作成し、AUDIT_DECISIONSの22件だけをownerへ収録して第136〜140束を生成する',
              'last_safe_checkpoint': 'private_encoding',
          })
          for packet in state['wave']['packets']:
              packet['status'] = 'audited'
              packet['audit_record'] = {'record': audit_path, 'status': 'complete'}
          state['permissions'].update({
              'translation_judgment_allowed': False,
              'fix_writes_allowed': True,
              'encoding_writes_allowed': True,
          })
          state['history'] = [
              {'stage': 'private_preparation', 'status': 'complete'},
              {'stage': 'private_quality_audit', 'status': 'complete'},
              {'stage': 'private_encoding', 'status': 'active'},
          ]

          manifest['status'] = 'private_encoding'
          manifest['transport'].update({'status': 'not_ready', 'translation_stage': 'private_encoding'})
          manifest['tracking_mode'] = 'private_encoding'
          manifest['quality_gate'] = qg
          manifest['private_stage'].update({
              'stage': 'private_encoding',
              'status': 'active',
              'transport_status': 'not_ready',
          })
          manifest['next_release'].update({
              'reservation_status': 'encoding_active',
              'formal_batches': [136, 137, 138, 139, 140],
              'current_private_stage': 'private_encoding',
          })

          next_task['reservation'].update({
              'status': 'encoding_active',
              'preparation_started': True,
              'quality_audit_started': True,
              'encoding_started': True,
              'formal_batch': 136,
          })

          for path, value in ((current_path, current), (state_path, state), (manifest_path, manifest), (next_path, next_task)):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          (p4 / 'CURRENT_HANDOFF.md').write_text('''# 現在の申し送り\n\n> 再開指示: `現状把握して作業の続きを`\n\n## 現在地\n\n- 実visibility: public\n- execution mode: `always_public_full_pipeline`\n- verified checkpoint: 第135束 / pair 1306 / project 1682\n- train: `yuwen-mowen-train-22`\n- branch: `agent/yuwen-mowen-train-22`\n- private stage: `private_encoding`\n- transport: `not_ready`\n- queue: 5packet / 58行 / 22修正 / 36保持\n\n## 品質監査\n\n二巡監査を完了した。師兄呼称、莫問の常体、`不必`と`欠一命`、決戦分岐の同文不一致を修正候補に固定した。同一原文は既存の安定訳を再利用し、分岐差と未完文は統合していない。\n\n## 次の作業\n\n`AUDIT_DECISIONS_YUWEN_MOWEN_TRAIN22_WAVE01_2026-07-28.json`の22件だけをowner assignment generatorで収録し、第136〜140束とreview recordを作る。\n\n## 禁止\n\n- encoding中に新しい翻訳判断を行わない。\n- AUDIT_DECISIONS外のfix値を書かない。\n- ownerを手書きで推測せず、generatorを使う。\n- manifest ready前にPRを開かない。\n- ゲームフォルダへ配置しない。\n''', encoding='utf-8')
          PY
      - name: Commit audited wave
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _phase4_proofread/AUDIT_YUWEN_MOWEN_TRAIN22_WAVE01_2026-07-28.md
          git add _phase4_proofread/AUDIT_DECISIONS_YUWEN_MOWEN_TRAIN22_WAVE01_2026-07-28.json
          git add _phase4_proofread/CURRENT_WORK.json
          git add _phase4_proofread/PRIVATE_STAGE_STATE.json
          git add _phase4_proofread/CI_TRAIN_MANIFEST.json
          git add _phase4_proofread/NEXT_TASK_PACKET.json
          git add _phase4_proofread/CURRENT_HANDOFF.md
          git commit -m '翻訳: train-22品質監査を完了して収録へ移行'
          git push origin HEAD:${{ github.ref_name }}
