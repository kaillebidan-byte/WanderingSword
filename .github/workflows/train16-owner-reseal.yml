name: Train16 owner reseal

on:
  push:
    branches:
      - agent/yuwen-mowen-train-16
    paths:
      - ".github/workflows/train16-owner-reseal.yml"

permissions:
  contents: write

jobs:
  reseal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout train branch
        uses: actions/checkout@v4
        with:
          ref: agent/yuwen-mowen-train-16
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run owner generator regression
        run: python _tools/test_apply_owner_assignment.py

      - name: Reseal owner assignment from repository bytes
        run: python _tools/apply_owner_assignment_v2.py

      - name: Verify owner assignment attestation
        run: python _tools/check_owner_assignment_result.py

      - name: Commit resealed evidence and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            _phase4_proofread/OWNER_ASSIGNMENT_RESULT.json \
            _phase4_proofread/CI_TRAIN_MANIFEST.json \
            _phase4_proofread/PRIVATE_STAGE_STATE.json \
            _phase4_proofread/CURRENT_WORK.json \
            _phase4_proofread/fixes_*.json
          git rm .github/workflows/train16-owner-reseal.yml
          git diff --cached --check
          git commit -m "証跡: train-16 owner bytesを再封印"
          git push origin HEAD:agent/yuwen-mowen-train-16
