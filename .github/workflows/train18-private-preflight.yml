name: Train18 private preflight

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    if: >-
      github.event.repository.visibility == 'private' &&
      github.event.pull_request.number == 143
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout frozen train-18 HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run complete private release preflight
        run: python _tools/check_private_release_preflight.py --repository-visibility private --with-tests
