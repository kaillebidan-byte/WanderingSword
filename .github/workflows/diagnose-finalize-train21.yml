name: Diagnose finalize train21

on:
  push:
    branches:
      - agent/yuwen-mowen-train-21
    paths:
      - .github/workflows/diagnose-finalize-train21.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse finalization generator
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/finalize-train21-state.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "          PY\n"
          block = source.split(start, 1)[1].split(end, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/finalize_train21.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/finalize_train21.py
          set +e
          python _tools/check_release_finalization.py --with-tests > /tmp/finalization.txt 2>&1
          rc=$?
          set -e
          cp /tmp/finalization.txt _phase4_proofread/FINALIZATION_DIAGNOSTICS_TRAIN21.txt
          printf '%s\n' "$rc" > _phase4_proofread/FINALIZATION_DIAGNOSTICS_TRAIN21.exitcode
      - name: Commit candidate state and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _phase4_proofread/RELEASE_EVIDENCE_YUWEN_MOWEN_TRAIN_21.json
          git add _phase4_proofread/APPLIED_FIXES_YUWEN_MOWEN_BATCH135_2026-07-28.md
          git add _phase4_proofread/CI_TRAIN_MANIFEST.json
          git add _phase4_proofread/CURRENT_WORK.json
          git add _phase4_proofread/PRIVATE_STAGE_STATE.json
          git add _phase4_proofread/NEXT_TASK_PACKET.json
          git add _phase4_proofread/CURRENT_HANDOFF.md
          git add _phase4_proofread/FINALIZATION_DIAGNOSTICS_TRAIN21.txt
          git add _phase4_proofread/FINALIZATION_DIAGNOSTICS_TRAIN21.exitcode
          git commit -m '診断: train-21 release state候補とchecker結果を記録'
          git push origin HEAD:${{ github.ref_name }}
