name: Release train orchestrator

on:
  pull_request:
    types:
      - labeled
      - synchronize
    branches:
      - main
    paths:
      - "_phase4_proofread/fixes_*.json"
      - "_phase4_proofread/CANDIDATE_*.json"
      - "_phase4_proofread/CI_TRAIN_MANIFEST.json"
      - "_phase4_proofread/CURRENT_WORK.json"
      - "_phase4_proofread/NEXT_TASK_PACKET.json"
      - "_phase4_proofread/PRIVATE_STAGE_STATE.json"
      - "_phase4_proofread/TRANSLATION_QUALITY_GATE.md"
      - "_tools/check_*.py"
      - "_tools/test_*.py"
      - ".github/workflows/release-train-orchestrator.yml"
      - ".github/workflows/relation-audit.yml"
      - ".github/workflows/cross-register-qa.yml"
      - ".github/workflows/apply-curated-fixes.yml"

concurrency:
  group: release-train-orchestrator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.repository.visibility == 'public' &&
      (
        (
          github.event.action == 'labeled' &&
          (github.event.label.name == 'release-ci' || github.event.label.name == 'ci-heavy-rerun')
        ) ||
        (
          github.event.action == 'synchronize' &&
          (
            contains(github.event.pull_request.labels.*.name, 'release-ci') ||
            contains(github.event.pull_request.labels.*.name, 'ci-heavy-rerun')
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout frozen release HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run complete release preflight before heavy jobs
        shell: bash
        run: |
          set -o pipefail
          mkdir -p _ws_tmp/release_orchestrator
          python _tools/check_private_release_preflight.py \
            --repository-visibility public \
            --with-tests \
            2>&1 | tee _ws_tmp/release_orchestrator/preflight.txt

      - name: Upload preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-train-preflight-diagnostics
          path: _ws_tmp/release_orchestrator/
          if-no-files-found: error

  relation:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/relation-audit.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha }}

  cross:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/cross-register-qa.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha }}

  apply:
    needs:
      - relation
      - cross
    permissions:
      contents: write
    uses: ./.github/workflows/apply-curated-fixes.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha }}
      head_ref: ${{ github.event.pull_request.head.ref }}

  complete:
    needs: apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record staged release success
        run: |
          echo "orchestrator_run=${{ github.run_id }}"
          echo "release_head=${{ github.event.pull_request.head.sha }}"
          echo "order=preflight -> relation+cross -> apply"
