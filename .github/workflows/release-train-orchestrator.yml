name: Release train orchestrator

on:
  pull_request:
    types:
      - labeled
      - synchronize
    branches:
      - main
    paths:
      - "_phase4_proofread/fixes_*.json"
      - "_phase4_proofread/CANDIDATE_*.json"
      - "_phase4_proofread/CI_TRAIN_MANIFEST.json"
      - "_phase4_proofread/CURRENT_WORK.json"
      - "_phase4_proofread/NEXT_TASK_PACKET.json"
      - "_phase4_proofread/PRIVATE_STAGE_STATE.json"
      - "_phase4_proofread/TRANSLATION_QUALITY_GATE.md"
      - "_tools/check_*.py"
      - "_tools/test_*.py"
      - ".github/workflows/release-train-orchestrator.yml"
      - ".github/workflows/relation-audit.yml"
      - ".github/workflows/cross-register-qa.yml"
      - ".github/workflows/apply-curated-fixes.yml"

concurrency:
  group: release-train-orchestrator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.repository.visibility == 'public' &&
      (
        (
          github.event.action == 'labeled' &&
          (github.event.label.name == 'release-ci' || github.event.label.name == 'ci-heavy-rerun')
        ) ||
        (
          github.event.action == 'synchronize' &&
          (
            contains(github.event.pull_request.labels.*.name, 'release-ci') ||
            contains(github.event.pull_request.labels.*.name, 'ci-heavy-rerun')
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    outputs:
      proceed: ${{ steps.release_guard.outputs.proceed }}
      status: ${{ steps.release_guard.outputs.status }}
      reason: ${{ steps.release_guard.outputs.reason }}
    steps:
      - name: Checkout event release HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve live pull request HEAD
        id: live_pr
        shell: bash
        run: |
          set -euo pipefail
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" --jq .head.sha)"
          if [[ ! "$live_head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid live PR HEAD: $live_head" >&2
            exit 1
          fi
          echo "head=$live_head" >> "$GITHUB_OUTPUT"

      - name: Guard release inputs against stale event and state
        id: release_guard
        shell: bash
        run: |
          set -euo pipefail
          python _tools/release_orchestrator_guard.py \
            --event-action "${{ github.event.action }}" \
            --event-label "${{ github.event.label.name }}" \
            --event-head "${{ github.event.pull_request.head.sha }}" \
            --current-pr-head "${{ steps.live_pr.outputs.head }}" \
            --head-ref "${{ github.event.pull_request.head.ref }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --github-output "$GITHUB_OUTPUT" \
            --output /tmp/release-orchestrator-guard.json

      - name: Remove stale release labels
        if: steps.release_guard.outputs.remove_release_labels == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['release-ci', 'ci-heavy-rerun']) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

      - name: Record release guard result
        run: |
          echo "status=${{ steps.release_guard.outputs.status }}"
          echo "reason=${{ steps.release_guard.outputs.reason }}"
          echo "event_head=${{ github.event.pull_request.head.sha }}"
          echo "live_head=${{ steps.live_pr.outputs.head }}"

  preflight:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout frozen release HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run complete release preflight before heavy jobs
        shell: bash
        run: |
          set -o pipefail
          mkdir -p _ws_tmp/release_orchestrator
          python _tools/check_private_release_preflight.py \
            --repository-visibility public \
            --with-tests \
            2>&1 | tee _ws_tmp/release_orchestrator/preflight.txt

      - name: Upload preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-train-preflight-diagnostics
          path: _ws_tmp/release_orchestrator/
          if-no-files-found: error

  relation:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/relation-audit.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha }}

  cross:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/cross-register-qa.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha }}

  apply:
    needs:
      - relation
      - cross
    permissions:
      contents: write
    uses: ./.github/workflows/apply-curated-fixes.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha }}
      head_ref: ${{ github.event.pull_request.head.ref }}

  complete:
    needs: apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Write deterministic finalization inputs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ORCHESTRATOR_RUN_ID: ${{ github.run_id }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
          ASSET_HEAD: ${{ needs.apply.outputs.asset_head }}
          APPLY_CHANGED: ${{ needs.apply.outputs.apply_changed }}
        run: |
          mkdir -p _ws_tmp/release_orchestrator
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          asset_head = os.environ["ASSET_HEAD"]
          if len(asset_head) != 40:
              raise SystemExit(f"invalid asset_head output: {asset_head!r}")
          payload = {
              "schema_version": 1,
              "pr": int(os.environ["PR_NUMBER"]),
              "orchestrator_run_id": int(os.environ["ORCHESTRATOR_RUN_ID"]),
              "ci_head": os.environ["CI_HEAD"],
              "asset_head": asset_head,
              "apply_changed": os.environ["APPLY_CHANGED"] == "true",
          }
          path = Path("_ws_tmp/release_orchestrator/finalization-inputs.json")
          path.write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(path.read_text(encoding="utf-8"), end="")
          PY

      - name: Upload deterministic finalization inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-finalization-inputs-${{ github.event.pull_request.number }}
          path: _ws_tmp/release_orchestrator/finalization-inputs.json
          if-no-files-found: error

      - name: Remove active release rerun labels
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['release-ci', 'ci-heavy-rerun']) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

      - name: Record staged release success
        run: |
          echo "orchestrator_run=${{ github.run_id }}"
          echo "ci_head=${{ github.event.pull_request.head.sha }}"
          echo "asset_head=${{ needs.apply.outputs.asset_head }}"
          echo "apply_changed=${{ needs.apply.outputs.apply_changed }}"
          echo "order=guard -> preflight -> relation+cross -> apply -> finalization-inputs -> release-label-cleanup"
