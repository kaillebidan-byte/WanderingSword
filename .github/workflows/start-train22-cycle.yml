name: Start train22 cycle

on:
  push:
    branches:
      - agent/yuwen-mowen-train-22
    paths:
      - .github/workflows/start-train22-cycle.yml

permissions:
  contents: write
  actions: read

jobs:
  start:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lock execution mode and initialize train22
        run: |
          python _tools/select_cycle_execution_mode.py --repository-visibility public --write
          python - <<'PY'
          import json
          from pathlib import Path

          p4 = Path('_phase4_proofread')
          current_path = p4 / 'CURRENT_WORK.json'
          state_path = p4 / 'PRIVATE_STAGE_STATE.json'
          manifest_path = p4 / 'CI_TRAIN_MANIFEST.json'
          next_path = p4 / 'NEXT_TASK_PACKET.json'

          current = json.loads(current_path.read_text(encoding='utf-8'))
          state = json.loads(state_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          next_task = json.loads(next_path.read_text(encoding='utf-8'))

          checkpoint = current['checkpoint']
          previous_release = {
              'train_id': 'yuwen-mowen-train-21',
              'release_id': 'yuwen-mowen-train-21-r1',
              'pr': 148,
              'merge_sha': '556f5b040694876073ea14383ad246d9381a67eb',
          }
          source_artifact = {
              'workflow': 'Release train orchestrator',
              'run_id': 30321697780,
              'artifact_id': 8674239509,
              'artifact_name': 'relation-audit-evidence',
              'artifact_file': 'yuwen_mowen.json',
              'digest': 'sha256:bf7f79e65dbcbacbc33f17ee2d3020ad3313371df064bc55dc16b5592a3bf5c0',
              'head_sha': '39155e6dc236e7253a264e0870ccd9f343f0608e',
          }
          totals = {
              'bundle_count': 0,
              'reviewed_rows': 0,
              'reviewed_keys': 0,
              'unique_reviewed_rows': 0,
              'fix_keys': 0,
              'unique_fix_rows': 0,
              'new_pair_keys': 0,
              'new_project_keys': 0,
              'cross_register_keys': 0,
              'existing_owner_updates': 0,
              'keep_only_bundles': 0,
          }
          quality_gate = {
              'schema_version': 1,
              'primary_objective': 'repair_substantive_translation_defects',
              'throughput_metrics_role': 'transport_only',
              'low_yield_threshold_percent': 15,
              'reviewed_keys': 0,
              'unique_reviewed_rows': 0,
              'fix_keys': 0,
              'unique_fix_rows': 0,
              'keep_only_bundles': 0,
              'pre_challenge_unique_fix_rows': 0,
              'low_yield_detected': False,
              'release_decision': 'pending',
              'challenge_pass': None,
          }

          current['operation_mode']['declared_state'] = 'private_preparation'
          current['immediate_next'] = {
              'scene_groups': ['32025_1'],
              'task': '最新Relation artifactで32025_1と近接場面を確認し、train-22 waveのcandidate packetを準備する。',
              'boundary': 'private_preparationでは翻訳判断、fix、owner、正式束を書かない。',
              'packet': '_phase4_proofread/NEXT_TASK_PACKET.json',
          }
          current['ci_train'] = {
              'phase': 'phase1_wave',
              'policy': '_phase4_proofread/CI_TRAIN_PHASE2.md',
              'quality_policy': '_phase4_proofread/TRANSLATION_QUALITY_GATE.md',
              'private_stage_policy': '_phase4_proofread/PRIVATE_TRANSLATION_STAGES.md',
              'manifest': '_phase4_proofread/CI_TRAIN_MANIFEST.json',
              'train_id': 'yuwen-mowen-train-22',
              'branch': 'agent/yuwen-mowen-train-22',
              'status': 'private_preparation',
              'transport_status': 'not_ready',
              'base_checkpoint_batch': 135,
              'thresholds': manifest.get('thresholds', {'bundle_count': 4, 'reviewed_rows': 40, 'fix_keys': 20}),
              'caps': manifest.get('caps', {'bundle_count': 6, 'reviewed_rows': 60}),
              'totals': totals,
              'quality_gate': quality_gate,
              'private_stage': {
                  'stage': 'private_preparation',
                  'status': 'active',
                  'transport_status': 'not_ready',
                  'wave_id': 'yuwen-mowen-train-22-wave-01',
                  'cycle_status': 'running',
                  'cycle_checkpoint': 'private_preparation',
              },
              'tracking_issue': None,
              'draft_pr': None,
              'applied_result': None,
              'verified_result': None,
              'finalization_phase': 'phase2',
              'post_merge_state_pr_required': False,
              'single_pr_finalization': True,
              'release_evidence': None,
              'previous_release': previous_release,
          }

          state['train_id'] = 'yuwen-mowen-train-22'
          state['stage'] = 'private_preparation'
          state['cycle_control'].update({
              'status': 'running',
              'continuation_required': True,
              'stop_reason': None,
              'exact_next_action': '最新Relation artifactから32025_1と近接場面を抽出し、candidate packetとpreparation recordを作成する',
              'last_safe_checkpoint': 'private_preparation',
              'execution_mode': 'always_public_full_pipeline',
              'cycle_start_visibility': 'public',
              'mode_locked_for_cycle': True,
              'normal_completion_target': 'merged',
          })
          state['wave'] = {
              'wave_id': 'yuwen-mowen-train-22-wave-01',
              'queue_status': 'preparing',
              'seal_reason': None,
              'seal_attestation': None,
              'packets': [],
              'encoding_summary': None,
          }
          state['transport'] = {
              'status': 'not_ready',
              'history': [{'status': 'not_ready', 'translation_stage': 'private_preparation'}],
              'pr': None,
              'merge_sha': None,
          }
          state['permissions'] = {
              'translation_judgment_allowed': False,
              'fix_writes_allowed': False,
              'encoding_writes_allowed': False,
              'throughput_metrics_visible': True,
              'metrics_frozen': False,
          }
          state['history'] = [{'stage': 'private_preparation', 'status': 'active'}]
          state['replenishment_reason'] = 'post_merge_minimal_reservation_expansion'
          state['source_artifact'] = source_artifact
          state['previous_release'] = previous_release
          state.pop('verified_result', None)

          manifest = {
              'schema_version': 2,
              'phase': 'phase1_wave',
              'train_id': 'yuwen-mowen-train-22',
              'branch': 'agent/yuwen-mowen-train-22',
              'draft_pr': None,
              'status': 'private_preparation',
              'transport': {'status': 'not_ready', 'translation_stage': 'private_preparation', 'pr': None, 'merge_sha': None},
              'base_checkpoint': {
                  'batch': checkpoint['batch'],
                  'pair_applied_keys': checkpoint['pair_applied_keys'],
                  'project_applied_keys': checkpoint['project_applied_keys'],
                  'produced_by_pr': checkpoint['produced_by_pr'],
                  'release_identity': checkpoint['release_identity'],
              },
              'thresholds': current['ci_train']['thresholds'],
              'caps': current['ci_train']['caps'],
              'allowed_early_release_reasons': ['workflow_change', 'schema_change', 'security_or_visibility', 'urgent_build_verification'],
              'release_trigger': None,
              'totals': totals,
              'bundles': [],
              'tracking_issue': None,
              'tracking_mode': 'private_preparation',
              'finalization_phase': 'phase2',
              'post_merge_state_pr_required': False,
              'single_pr_finalization': True,
              'release_evidence': None,
              'previous_release': previous_release,
              'quality_gate': quality_gate,
              'private_stage': {
                  'contract': '_phase4_proofread/PRIVATE_TRANSLATION_STAGES.json',
                  'state': '_phase4_proofread/PRIVATE_STAGE_STATE.json',
                  'stage': 'private_preparation',
                  'status': 'active',
                  'transport_status': 'not_ready',
              },
              'next_release': {
                  'candidate_scene': ['32025_1'],
                  'reservation_status': 'preparing',
                  'reservation_schema': 6,
                  'formal_batches': [],
                  'current_private_stage': 'private_preparation',
              },
          }

          next_task['status'] = 'active'
          next_task['task_id'] = 'train22-wave01-preparation'
          next_task['reservation'] = {
              'status': 'preparing',
              'wave_id': 'yuwen-mowen-train-22-wave-01',
              'packet_id': 'yuwen-mowen-32025-1',
              'preparation_started': True,
              'quality_audit_started': False,
              'encoding_started': False,
              'formal_batch': None,
          }
          next_task['release_candidate'] = {
              'train_id': 'yuwen-mowen-train-22',
              'release_id': None,
              'pr': None,
              'status': 'not_ready',
              'merge_sha': None,
          }
          next_task['ci_train']['train_id'] = 'yuwen-mowen-train-22'
          next_task['ci_train']['planned_batch'] = 136

          for path, value in ((current_path, current), (state_path, state), (manifest_path, manifest), (next_path, next_task)):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          handoff = p4 / 'CURRENT_HANDOFF.md'
          handoff.write_text('''# 現在の申し送り\n\n> 再開指示: `現状把握して作業の続きを`\n\n## 現在地\n\n- 実visibility: public\n- execution mode: `always_public_full_pipeline`\n- verified checkpoint: 第135束 / pair 1306 / project 1682\n- train: `yuwen-mowen-train-22`\n- branch: `agent/yuwen-mowen-train-22`\n- private stage: `private_preparation`\n- transport: `not_ready`\n- reservation: `32025_1`\n\n## 次の作業\n\n最新Relation artifactで`32025_1`と近接場面を確認し、実在行だけからcandidate packetとpreparation recordを作る。preparationでは翻訳判断、fix、owner、正式束を書かない。\n\n## 禁止\n\n- preparation中に翻訳判断、fix、owner、正式束を書かない。\n- candidate owner snapshotを特定人物ペアownerだけから推測しない。\n- manifest ready前にPRを開かない。\n- ゲームフォルダへ配置しない。\n''', encoding='utf-8')
          PY
      - name: Download and inspect latest relation artifact
        run: |
          mkdir -p _ws_tmp/train22_artifact
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8674239509/zip" \
            -o _ws_tmp/train22_artifact/relation.zip
          unzip -q _ws_tmp/train22_artifact/relation.zip -d _ws_tmp/train22_artifact/unpacked
          python - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('_ws_tmp/train22_artifact/unpacked')
          files = sorted(root.rglob('*'))
          target_file = next((p for p in files if p.name == 'yuwen_mowen.json'), None)
          if target_file is None:
              raise SystemExit('yuwen_mowen.json not found in artifact')
          raw = target_file.read_text(encoding='utf-8')
          data = json.loads(raw)
          pretty = json.dumps(data, ensure_ascii=False, indent=2)
          target = '32025_1'
          snippets = []
          start = 0
          while True:
              pos = pretty.find(target, start)
              if pos < 0:
                  break
              snippets.append(pretty[max(0, pos-4000):min(len(pretty), pos+8000)])
              start = pos + len(target)
              if len(snippets) >= 12:
                  break
          ids = sorted(set(re.findall(r'(?<!\d)(\d{3,6}_\d+)(?!\d)', pretty)), key=lambda x: (abs(int(x.split('_')[0])-32025), int(x.split('_')[0]), int(x.split('_')[1])))
          summary = {
              'schema_version': 1,
              'target': target,
              'artifact': {
                  'run_id': 30321697780,
                  'artifact_id': 8674239509,
                  'digest': 'sha256:bf7f79e65dbcbacbc33f17ee2d3020ad3313371df064bc55dc16b5592a3bf5c0',
                  'head_sha': '39155e6dc236e7253a264e0870ccd9f343f0608e',
                  'file': str(target_file.relative_to(root)),
              },
              'top_level_type': type(data).__name__,
              'top_level_keys': list(data.keys())[:50] if isinstance(data, dict) else None,
              'target_occurrences': pretty.count(target),
              'nearest_scene_ids': ids[:40],
              'snippets': snippets,
          }
          out = Path('_phase4_proofread/INSPECTION_YUWEN_MOWEN_TRAIN22_ARTIFACT_2026-07-28.json')
          out.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit initialized cycle and inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _phase4_proofread/CURRENT_WORK.json
          git add _phase4_proofread/PRIVATE_STAGE_STATE.json
          git add _phase4_proofread/CI_TRAIN_MANIFEST.json
          git add _phase4_proofread/NEXT_TASK_PACKET.json
          git add _phase4_proofread/CURRENT_HANDOFF.md
          git add _phase4_proofread/INSPECTION_YUWEN_MOWEN_TRAIN22_ARTIFACT_2026-07-28.json
          git commit -m '翻訳: train-22 cycleを開始して予約場面を抽出'
          git push origin HEAD:${{ github.ref_name }}
