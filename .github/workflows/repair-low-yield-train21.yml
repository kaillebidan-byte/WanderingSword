name: Repair low yield train21

on:
  push:
    branches:
      - agent/yuwen-mowen-train-21
    paths:
      - .github/workflows/repair-low-yield-train21.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize challenge evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p4 = Path('_phase4_proofread')
          challenge = {
              'status': 'complete',
              'scope': 'all_initial_keep_unique_rows',
              'reviewed_candidate_keep_rows': 57,
              'findings_unique_rows': 0,
              'finding_keys': 0,
              'record': '_phase4_proofread/QUALITY_CHALLENGE_YUWEN_MOWEN_TRAIN21_WAVE01_2026-07-28.md',
          }
          for rel, keys in [
              ('CI_TRAIN_MANIFEST.json', ('quality_gate',)),
              ('CURRENT_WORK.json', ('ci_train', 'quality_gate')),
          ]:
              path = p4 / rel
              value = json.loads(path.read_text(encoding='utf-8'))
              target = value
              for key in keys:
                  target = target[key]
              target['challenge_pass'] = challenge
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python _tools/apply_owner_assignment_v2.py
          python _tools/check_owner_assignment_result.py
          python _tools/check_private_translation_stage.py
          python _tools/check_ci_train_manifest_v2.py --require-ready
          python _tools/check_translation_quality_gate.py
      - name: Commit normalized evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _phase4_proofread/CI_TRAIN_MANIFEST.json
          git add _phase4_proofread/CURRENT_WORK.json
          git add _phase4_proofread/PRIVATE_STAGE_STATE.json
          git add _phase4_proofread/OWNER_ASSIGNMENT_RESULT.json
          git add _phase4_proofread/OWNER_ASSIGNMENT_OWNER_DIGESTS_*.json
          git add _phase4_proofread/fixes_*.json
          git commit -m '翻訳: train-21低収穫challenge証跡を正規化'
          git push origin HEAD:${{ github.ref_name }}
