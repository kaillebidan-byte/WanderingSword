name: Institution contract tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - "README.md"
      - "AGENTS.md"
      - "_phase4_proofread/PROJECT_SCOPE_LOCK.json"
      - "_phase4_proofread/GITHUB_API_WRITE_POLICY.json"
      - "_phase4_proofread/FACTORY_FLOW_CONTRACT.json"
      - "_phase4_proofread/FACTORY_FLOW.md"
      - "_phase4_proofread/VISIBILITY_PREFLIGHT_CONTRACT.json"
      - "_phase4_proofread/EXECUTION_MODES.json"
      - "_phase4_proofread/PRIVATE_TRANSLATION_STAGES.json"
      - "_phase4_proofread/PRIVATE_TRANSLATION_STAGES.md"
      - "_phase4_proofread/CI_TRAIN_PHASE1.md"
      - "_phase4_proofread/CI_TRAIN_PHASE2.md"
      - "_phase4_proofread/CI_TRAIN_MANIFEST.json"
      - "_phase4_proofread/CURRENT_WORK.json"
      - "_phase4_proofread/CURRENT_HANDOFF.md"
      - "_phase4_proofread/NEXT_TASK_PACKET.json"
      - "_phase4_proofread/PHASE_COMPLETION_SIGNAL.json"
      - "_phase4_proofread/REGULATED_PHASE_STATE.json"
      - "_phase4_proofread/FINAL_RESPONSE_GATE.md"
      - "_phase4_proofread/ALWAYS_PUBLIC_FULL_PIPELINE.md"
      - "_phase4_proofread/AUTONOMOUS_VISIBILITY_CYCLE.md"
      - "_phase4_proofread/SESSION_BOOTSTRAP.md"
      - "_phase4_proofread/COLD_START_ACCEPTANCE.md"
      - "_phase4_proofread/PUBLIC_CI_WINDOW.md"
      - "_phase4_proofread/RUNBOOK_人物ペア再監査.md"
      - "_phase4_proofread/PLAN_章別通読監査.md"
      - "_tools/check_state_json_integrity.py"
      - "_tools/check_operational_docs_consistency.py"
      - "_tools/check_private_release_preflight.py"
      - "_tools/check_private_translation_stage.py"
      - "_tools/check_ci_train_manifest.py"
      - "_tools/check_project_scope_lock.py"
      - "_tools/check_pr_commit_budget.py"
      - "_tools/check_visibility_preflight_contract.py"
      - "_tools/check_operation_mode.py"
      - "_tools/check_autonomous_cycle.py"
      - "_tools/check_phase_completion_signal.py"
      - "_tools/regulated_phase_terminal_consumer.js"
      - "_tools/reconcile_merged_cycle.py"
      - "_tools/select_cycle_execution_mode.py"
      - "_tools/translation_factory_controller.py"
      - "_tools/test_translation_factory_controller.py"
      - "_tools/test_translation_factory_workflow.py"
      - "_tools/test_check_operational_docs_consistency.py"
      - "_tools/test_check_project_scope_lock.py"
      - "_tools/test_check_pr_commit_budget.py"
      - "_tools/test_pr_commit_budget_workflow.py"
      - "_tools/test_check_visibility_preflight_contract.py"
      - "_tools/test_check_operation_mode.py"
      - "_tools/test_check_private_translation_stage.py"
      - "_tools/test_check_ci_train_manifest.py"
      - "_tools/test_check_autonomous_cycle.py"
      - "_tools/test_check_phase_completion_signal.py"
      - "_tools/test_regulated_phase_terminal_consumer.js"
      - "_tools/test_reconcile_merged_cycle.py"
      - "_tools/test_select_cycle_execution_mode.py"
      - "_tools/test_release_ci_triggers.py"
      - ".github/workflows/institution-contract-tests.yml"
      - ".github/workflows/pr-commit-budget.yml"
      - ".github/workflows/reconcile-merged-cycle.yml"
      - ".github/workflows/translation-factory-plan.yml"

concurrency:
  group: institution-contract-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run project scope and visibility regressions
        run: |
          python _tools/check_project_scope_lock.py --repository kaillebidan-byte/WanderingSword
          python _tools/test_check_project_scope_lock.py
          python _tools/check_visibility_preflight_contract.py
          python _tools/test_check_visibility_preflight_contract.py

      - name: Run factory flow regressions
        run: |
          python _tools/translation_factory_controller.py --repository-visibility public --validate-contract-only
          python _tools/translation_factory_controller.py --repository-visibility public
          python _tools/test_translation_factory_controller.py
          python _tools/test_translation_factory_workflow.py

      - name: Run operational document consistency
        run: |
          python _tools/check_operational_docs_consistency.py
          python _tools/test_check_operational_docs_consistency.py

      - name: Run GitHub API write regressions
        run: |
          python _tools/check_pr_commit_budget.py --validate-policy-only
          python _tools/test_check_pr_commit_budget.py
          python _tools/test_pr_commit_budget_workflow.py

      - name: Run semantic wave-size regressions
        run: |
          python _tools/test_check_private_translation_stage.py
          python _tools/test_check_ci_train_manifest.py
          python _tools/check_private_translation_stage.py
          python _tools/check_ci_train_manifest_v2.py

      - name: Run execution mode regressions
        run: |
          python _tools/test_check_operation_mode.py
          python _tools/test_check_autonomous_cycle.py
          python _tools/test_select_cycle_execution_mode.py

      - name: Run regulated phase signal regressions
        run: |
          python _tools/check_phase_completion_signal.py
          python _tools/test_check_phase_completion_signal.py
          node _tools/test_regulated_phase_terminal_consumer.js

      - name: Run post-merge reconciliation regression
        run: python _tools/test_reconcile_merged_cycle.py

      - name: Validate JSON encoding and workflow trigger boundaries
        run: |
          python _tools/check_state_json_integrity.py
          python _tools/test_release_ci_triggers.py
          git diff --check
