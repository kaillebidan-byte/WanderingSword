name: Institution contract tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - "_phase4_proofread/PROJECT_SCOPE_LOCK.json"
      - "_phase4_proofread/VISIBILITY_PREFLIGHT_CONTRACT.json"
      - "_phase4_proofread/EXECUTION_MODES.json"
      - "_phase4_proofread/PHASE_COMPLETION_SIGNAL.json"
      - "_phase4_proofread/REGULATED_PHASE_STATE.json"
      - "_phase4_proofread/ALWAYS_PUBLIC_FULL_PIPELINE.md"
      - "_phase4_proofread/AUTONOMOUS_VISIBILITY_CYCLE.md"
      - "_phase4_proofread/SESSION_BOOTSTRAP.md"
      - "_phase4_proofread/PLAN_章別通読監査.md"
      - "AGENTS.md"
      - "_tools/check_state_json_integrity.py"
      - "_tools/check_private_release_preflight.py"
      - "_tools/check_project_scope_lock.py"
      - "_tools/check_operation_mode.py"
      - "_tools/check_autonomous_cycle.py"
      - "_tools/check_phase_completion_signal.py"
      - "_tools/reconcile_merged_cycle.py"
      - "_tools/select_cycle_execution_mode.py"
      - "_tools/test_check_project_scope_lock.py"
      - "_tools/test_check_operation_mode.py"
      - "_tools/test_check_autonomous_cycle.py"
      - "_tools/test_check_phase_completion_signal.py"
      - "_tools/test_reconcile_merged_cycle.py"
      - "_tools/test_select_cycle_execution_mode.py"
      - "_tools/test_release_ci_triggers.py"
      - ".github/workflows/institution-contract-tests.yml"
      - ".github/workflows/reconcile-merged-cycle.yml"

concurrency:
  group: institution-contract-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run project scope regressions
        run: |
          python _tools/check_project_scope_lock.py --repository kaillebidan-byte/WanderingSword
          python _tools/test_check_project_scope_lock.py

      - name: Run execution mode regressions
        run: |
          python _tools/test_check_operation_mode.py
          python _tools/test_check_autonomous_cycle.py
          python _tools/test_select_cycle_execution_mode.py

      - name: Run regulated phase signal regressions
        run: |
          python _tools/check_phase_completion_signal.py
          python _tools/test_check_phase_completion_signal.py

      - name: Run post-merge reconciliation regression
        run: python _tools/test_reconcile_merged_cycle.py

      - name: Validate JSON encoding and workflow trigger boundaries
        run: |
          python _tools/check_state_json_integrity.py
          python _tools/test_release_ci_triggers.py
          git diff --check
