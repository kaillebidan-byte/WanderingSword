name: Apply curated localization fixes

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      head_ref:
        required: true
        type: string

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      WS_TMP: ${{ github.workspace }}/_ws_tmp
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout staged release branch with LFS assets
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref }}
          lfs: true
          fetch-depth: 0
          show-progress: false

      - name: Verify branch still matches staged QA HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ inputs.target_sha }}"
          test "$actual" = "$expected" || {
            echo "PR head changed after release QA: expected=$expected actual=$actual" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate pre-Apply transport, quality, and candidate ownership
        shell: bash
        run: |
          mkdir -p _ws_tmp/apply_fixes
          set -o pipefail
          python _tools/check_release_transport_state.py \
            2>&1 | tee _ws_tmp/apply_fixes/release_transport_state.txt
          python _tools/check_translation_quality_gate.py \
            2>&1 | tee _ws_tmp/apply_fixes/translation_quality_gate.txt
          python _tools/check_candidate_ownership.py --require-current-wave \
            2>&1 | tee _ws_tmp/apply_fixes/candidate_ownership.txt
          python _tools/test_check_release_transport_state.py
          python _tools/test_check_translation_quality_gate.py
          python _tools/test_check_candidate_ownership.py
          python _tools/test_check_next_task_packet_minimal.py

      - name: Collect all curated fix batches
        shell: bash
        run: |
          mkdir -p _ws_tmp/apply_fixes
          shopt -s nullglob
          files=(_phase4_proofread/fixes_*.json)
          if ((${#files[@]} == 0)); then
            echo 'No curated fix batches found' >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}" > _ws_all_fix_files.txt
          printf 'Found %s curated fix batches\n' "${#files[@]}"

      - name: Report next-task reservation
        run: python _tools/report_next_task_ownership.py --out _ws_tmp/apply_fixes/next_task_ownership.json

      - name: Validate pending and applied fixes
        shell: bash
        run: |
          mapfile -t files < _ws_all_fix_files.txt
          set -o pipefail
          python _tools/validate_fixes_json.py --allow-applied "${files[@]}" \
            2>&1 | tee _ws_tmp/apply_fixes/fixes_validation.txt

      - name: Detect pending fixes
        id: pending
        shell: bash
        run: |
          mapfile -t files < _ws_all_fix_files.txt
          set -o pipefail
          python _tools/apply_fixes_json.py "${files[@]}" \
            2>&1 | tee _ws_tmp/apply_fixes/fixes_preview_before.txt
          if grep -q '^\[プレビュー\] 計0件' _ws_tmp/apply_fixes/fixes_preview_before.txt; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply all pending fixes and rebuild pak once
        if: steps.pending.outputs.changed == 'true'
        shell: bash
        run: |
          mapfile -t files < _ws_all_fix_files.txt
          set -o pipefail
          python _tools/apply_fixes_json.py "${files[@]}" --apply \
            2>&1 | tee _ws_tmp/apply_fixes/apply.txt

      - name: Verify no pending differences remain
        shell: bash
        run: |
          mapfile -t files < _ws_all_fix_files.txt
          set -o pipefail
          python _tools/apply_fixes_json.py "${files[@]}" \
            2>&1 | tee _ws_tmp/apply_fixes/fixes_preview_after.txt
          grep -q '^\[プレビュー\] 計0件' _ws_tmp/apply_fixes/fixes_preview_after.txt
          python _tools/validate_fixes_json.py --allow-applied "${files[@]}" \
            2>&1 | tee _ws_tmp/apply_fixes/fixes_validation_after.txt

      - name: Generate applied record from manifest and measured owners
        id: applied_record
        shell: bash
        run: |
          python _tools/write_applied_record.py \
            2>&1 | tee _ws_tmp/apply_fixes/applied_record.txt
          if [[ -z "$(git status --porcelain -- _phase4_proofread/APPLIED_FIXES_*.md)" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run apply-specific regression tests and scans
        shell: bash
        run: |
          python _tools/test_check_candidate_ownership.py
          python _tools/test_check_next_task_packet_minimal.py
          python _tools/test_check_release_transport_state.py
          python _tools/test_write_applied_record.py
          python _tools/test_check_translation_quality_gate.py
          python _tools/check_release_transport_state.py
          python _tools/check_candidate_ownership.py --require-current-wave
          python _tools/check_next_task_packet.py --allow-pending
          python _tools/check_batch_planning.py
          python _tools/check_translation_quality_gate.py
          python _tools/test_apply_fixes_json.py
          python _tools/test_apply_fixes_shared_indices.py
          python _tools/test_update_audit_status.py
          python _tools/test_lint_register.py
          python _tools/test_extract_relation_context.py
          python _tools/lint_register.py --out-dir _ws_tmp/register_lint
          python _tools/extract_relation_context.py --out-dir _ws_tmp/relation_audit

      - name: Verify packaged output
        shell: bash
        run: |
          test -s _work/aaWanderingSword_JP_P.pak
          ls -lh _work/aaWanderingSword_JP_P.pak
          git lfs ls-files | grep -F '_work/aaWanderingSword_JP_P.pak'

      - name: Refresh audit status after applied record exists
        id: audit_status
        shell: bash
        run: |
          python _tools/update_audit_status.py
          if git diff --quiet -- _phase4_proofread/audit_status.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Explain deferred release-state finalization
        if: >-
          steps.pending.outputs.changed == 'true' ||
          steps.applied_record.outputs.changed == 'true' ||
          steps.audit_status.outputs.changed == 'true'
        shell: bash
        run: |
          echo 'Applied assets, applied record, or audit status changed.'
          echo 'Release evidence, CURRENT_WORK, handoff, and verified checkpoint are finalized after this bot commit.'
          echo 'Relation/Cross do not rerun for the generated commit; finalize-release performs strict state validation.'

      - name: Commit applied assets, applied record, and audit status
        if: >-
          steps.pending.outputs.changed == 'true' ||
          steps.applied_record.outputs.changed == 'true' ||
          steps.audit_status.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _work/jp/Wandering_Sword/Content/Localization \
            _work/aaWanderingSword_JP_P.pak \
            _phase4_proofread/APPLIED_FIXES_*.md \
            _phase4_proofread/audit_status.json
          git status --short
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No generated changes to commit'; exit 1; }
          git commit -m "Apply curated localization fixes and generate applied record"
          if [[ "${{ steps.pending.outputs.changed }}" == "true" ]]; then
            git lfs push origin HEAD
          fi
          git push origin HEAD:${{ inputs.head_ref }}

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curated-fixes-qa-${{ github.run_number }}
          path: |
            _ws_tmp/apply_fixes/
            _ws_tmp/register_lint/
            _ws_tmp/relation_audit/
          if-no-files-found: warn
