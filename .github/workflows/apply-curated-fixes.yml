name: Apply curated localization fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - "_phase4_proofread/fixes_*.json"
      - "_tools/apply_fixes_json.py"
      - "_tools/validate_fixes_json.py"
      - "_tools/test_apply_fixes_json.py"
      - "_tools/test_apply_fixes_shared_indices.py"
      - "_tools/update_audit_status.py"
      - "_tools/test_update_audit_status.py"
      - "_tools/check_handoff_consistency_v2.py"
      - "_tools/check_release_evidence.py"
      - "_tools/check_next_task_packet.py"
      - "_tools/report_next_task_ownership.py"
      - "_tools/test_check_handoff_consistency_v2.py"
      - "_tools/test_check_release_evidence.py"
      - "_tools/test_check_next_task_packet_ownership.py"
      - ".github/workflows/apply-curated-fixes.yml"

permissions:
  contents: write

concurrency:
  group: apply-curated-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      WS_TMP: ${{ github.workspace }}/_ws_tmp
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout PR branch with LFS assets
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          lfs: true
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect all curated fix batches
        shell: bash
        run: |
          mkdir -p _ws_tmp/apply_fixes
          shopt -s nullglob
          files=(_phase4_proofread/fixes_*.json)
          if ((${#files[@]} == 0)); then
            echo 'No curated fix batches found' >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}" > _ws_all_fix_files.txt
          printf 'Found %s curated fix batches\n' "${#files[@]}"

      - name: Report next-task ownership
        run: python _tools/report_next_task_ownership.py --out _ws_tmp/apply_fixes/next_task_ownership.json

      - name: Validate pending and applied fixes
        shell: bash
        run: |
          mapfile -t files < _ws_all_fix_files.txt
          set -o pipefail
          python _tools/validate_fixes_json.py --allow-applied "${files[@]}" \
            2>&1 | tee _ws_tmp/apply_fixes/fixes_validation.txt

      - name: Detect pending fixes
        id: pending
        shell: bash
        run: |
          mapfile -t files < _ws_all_fix_files.txt
          set -o pipefail
          python _tools/apply_fixes_json.py "${files[@]}" \
            2>&1 | tee _ws_tmp/apply_fixes/fixes_preview_before.txt
          if grep -q '^\[プレビュー\] 計0件' _ws_tmp/apply_fixes/fixes_preview_before.txt; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply all pending fixes and rebuild pak once
        if: steps.pending.outputs.changed == 'true'
        shell: bash
        run: |
          mapfile -t files < _ws_all_fix_files.txt
          set -o pipefail
          python _tools/apply_fixes_json.py "${files[@]}" --apply \
            2>&1 | tee _ws_tmp/apply_fixes/apply.txt

      - name: Verify no pending differences remain
        shell: bash
        run: |
          mapfile -t files < _ws_all_fix_files.txt
          set -o pipefail
          python _tools/apply_fixes_json.py "${files[@]}" \
            2>&1 | tee _ws_tmp/apply_fixes/fixes_preview_after.txt
          grep -q '^\[プレビュー\] 計0件' _ws_tmp/apply_fixes/fixes_preview_after.txt
          python _tools/validate_fixes_json.py --allow-applied "${files[@]}" \
            2>&1 | tee _ws_tmp/apply_fixes/fixes_validation_after.txt

      - name: Run regression tests and scans
        shell: bash
        run: |
          python _tools/test_check_handoff_consistency_v2.py
          python _tools/test_check_release_evidence.py
          python _tools/test_check_next_task_packet_ownership.py
          python _tools/check_handoff_consistency_v2.py
          python _tools/check_release_evidence.py
          python _tools/check_next_task_packet.py --allow-pending
          python _tools/test_apply_fixes_json.py
          python _tools/test_apply_fixes_shared_indices.py
          python _tools/test_update_audit_status.py
          python _tools/test_lint_register.py
          python _tools/test_extract_relation_context.py
          python _tools/lint_register.py --out-dir _ws_tmp/register_lint
          python _tools/extract_relation_context.py --out-dir _ws_tmp/relation_audit

      - name: Verify packaged output
        shell: bash
        run: |
          test -s _work/aaWanderingSword_JP_P.pak
          ls -lh _work/aaWanderingSword_JP_P.pak
          git lfs ls-files | grep -F '_work/aaWanderingSword_JP_P.pak'

      - name: Refresh audit status counts
        id: audit_status
        shell: bash
        run: |
          python _tools/update_audit_status.py
          if git diff --quiet -- _phase4_proofread/audit_status.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check checkpoint after audit refresh
        if: steps.pending.outputs.changed == 'false'
        shell: bash
        run: |
          python _tools/check_handoff_consistency_v2.py
          python _tools/check_release_evidence.py
          python _tools/check_next_task_packet.py --allow-pending

      - name: Explain deferred checkpoint check
        if: steps.pending.outputs.changed == 'true'
        shell: bash
        run: |
          echo 'Pending translation fixes were applied in this run.'
          echo 'The same PR will receive generated assets, then a state-only phase2 gate will finalize release evidence.'
          echo 'Relation/Cross/Apply will not restart for the generated asset commit or final state-only commit.'

      - name: Commit applied assets and audit status
        if: >-
          steps.pending.outputs.changed == 'true' ||
          steps.audit_status.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _work/jp/Wandering_Sword/Content/Localization _work/aaWanderingSword_JP_P.pak _phase4_proofread/audit_status.json
          git status --short
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No generated changes to commit'; exit 1; }
          git commit -m "Apply curated localization fixes and refresh audit status"
          if [[ "${{ steps.pending.outputs.changed }}" == "true" ]]; then
            git lfs push origin HEAD
          fi
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curated-fixes-qa-${{ github.run_number }}
          path: |
            _ws_tmp/apply_fixes/
            _ws_tmp/register_lint/
            _ws_tmp/relation_audit/
          if-no-files-found: warn
