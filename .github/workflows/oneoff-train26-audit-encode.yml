name: One-off Yuwen-Mowen train-26 audit and encode

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  audit-encode:
    if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'agent/yuwen-mowen-train-26' }}
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      AUDIT_SCRIPT_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/yuwen-mowen-train-26
          fetch-depth: 0

      - name: Materialize deterministic audit encoder
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          Path("/tmp/train26_audit_encode.py").write_bytes(
              gzip.decompress(base64.b64decode(os.environ["AUDIT_SCRIPT_B64"]))
          )
          PY
          python -m py_compile /tmp/train26_audit_encode.py

      - name: Complete private quality audit
        run: |
          python /tmp/train26_audit_encode.py audit
          python _tools/check_private_translation_stage.py
          python _tools/check_autonomous_cycle.py
          python _tools/check_ci_train_manifest.py

      - name: Commit audit checkpoint atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            _phase4_proofread/AUDIT_YUWEN_MOWEN_TRAIN26_WAVE01_2026-07-28.md \
            _phase4_proofread/AUDIT_DECISIONS_YUWEN_MOWEN_TRAIN26_WAVE01_2026-07-28.json \
            _phase4_proofread/QUALITY_CHALLENGE_YUWEN_MOWEN_TRAIN26_WAVE01_2026-07-28.md \
            _phase4_proofread/PRIVATE_STAGE_STATE.json \
            _phase4_proofread/CURRENT_WORK.json \
            _phase4_proofread/CI_TRAIN_MANIFEST.json
          git diff --cached --check
          git commit -m "監査: train-26 wave-01の40行を品質確定 [train26-audited]"
          git push

      - name: Encode fixes and seal owner assignment
        run: |
          python /tmp/train26_audit_encode.py freeze
          python _tools/apply_owner_assignment_v2.py

      - name: Validate frozen train before public CI
        run: |
          python _tools/check_candidate_ownership.py --require-current-wave
          python _tools/check_owner_assignment_result.py
          python _tools/check_private_translation_stage.py
          python _tools/check_ci_train_manifest.py --require-ready
          python _tools/check_translation_quality_gate.py
          python _tools/check_next_task_packet_v3.py
          python _tools/check_autonomous_cycle.py
          python _tools/check_private_release_preflight.py --repository-visibility public --with-tests

      - name: Commit frozen train and remove one-off workflow
        run: |
          git rm .github/workflows/oneoff-train26-audit-encode.yml
          git add _phase4_proofread
          git diff --cached --check
          git commit -m "翻訳: train-26を第154-157束でfreeze [train26-frozen]"
          git push
