name: Restore train22 base file

on:
  push:
    branches:
      - agent/yuwen-mowen-train-22
    paths:
      - .github/workflows/restore-train22-base-file.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Restore tracked base file and remove workflow
        run: |
          git fetch origin main
          git checkout origin/main -- _tools/__pycache__/locres.cpython-312.pyc
          rm .github/workflows/restore-train22-base-file.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: main追跡ファイルを翻訳差分から除外'
          git push origin HEAD:${{ github.ref_name }}
