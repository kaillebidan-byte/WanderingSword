name: Train16 finalize state

on:
  push:
    branches:
      - agent/yuwen-mowen-train-16
    paths:
      - ".github/workflows/train16-finalize-state.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout train branch
        uses: actions/checkout@v4
        with:
          ref: agent/yuwen-mowen-train-16
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Finalize release state
        run: python _tools/finalize_train16_state.py

      - name: Run structural checks
        run: |
          python _tools/check_state_json_integrity.py
          python _tools/check_release_evidence.py --verify-git-lineage
          python _tools/check_ci_train_manifest_v2.py
          python _tools/check_private_translation_stage.py
          python _tools/check_autonomous_cycle.py
          python _tools/check_next_task_packet.py

      - name: Commit final state and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            _phase4_proofread/RELEASE_EVIDENCE_YUWEN_MOWEN_TRAIN_16.json \
            _phase4_proofread/CI_TRAIN_MANIFEST.json \
            _phase4_proofread/PRIVATE_STAGE_STATE.json \
            _phase4_proofread/CURRENT_WORK.json \
            _phase4_proofread/NEXT_TASK_PACKET.json \
            _phase4_proofread/CURRENT_HANDOFF.md
          git rm .github/workflows/train16-finalize-state.yml _tools/finalize_train16_state.py
          git diff --cached --check
          git commit -m "状態: train-16をawaiting_private_mergeへ確定"
          git push origin HEAD:agent/yuwen-mowen-train-16
