name: Finalize train-19 state

on:
  push:
    branches:
      - agent/yuwen-mowen-train-19
    paths:
      - ".github/workflows/finalize-train19-state.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate finalization state
        run: python _tools/finalize_train19_once.py

      - name: Remove one-shot files
        run: rm -f .github/workflows/finalize-train19-state.yml _tools/finalize_train19_once.py

      - name: Verify finalization locally
        run: python _tools/check_release_finalization.py --with-tests

      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: train-19をphase2状態へ最終化"
          git push origin "HEAD:${GITHUB_REF_NAME}"
