name: Finalize train-19 state

on:
  push:
    branches:
      - agent/yuwen-mowen-train-19
    paths:
      - ".github/workflows/finalize-train19-state.yml"
      - "_tools/finalize_train19_trigger.txt"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate finalization state
        run: python _tools/finalize_train19_once.py

      - name: Capture finalization diagnostics
        shell: bash
        run: |
          set +e
          python _tools/check_release_finalization.py --with-tests > _phase4_proofread/FINALIZE_TRAIN19_DIAGNOSTICS.txt 2>&1
          code=$?
          echo "exit_code=${code}" >> _phase4_proofread/FINALIZE_TRAIN19_DIAGNOSTICS.txt
          exit 0

      - name: Commit generated state and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: train-19最終化診断を記録"
          git push origin "HEAD:${GITHUB_REF_NAME}"
